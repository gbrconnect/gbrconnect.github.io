      <div class="field"><label>Nova senha</label><input class="inp" id="np" type="password" placeholder="mínimo 6 caracteres"></div>
      <button class="btn btn-p" id="salvar-senha">Alterar senha</button></div></div>` : ''}
    <div class="card"><div class="card-h"><h3>Pontuação do ranking</h3><button class="btn btn-s" id="cfg-pts">Editar</button></div><div class="card-p">
      <div class="grid g3 tight" style="gap:10px">
        ${[['Campeão', cfg.p1], ['Vice', cfg.p2], ['3º', cfg.p3], ['4º', cfg.p4], ['5º–8º', cfg.p58], ['Demais', cfg.outros]]
      .map(x => `<div><div class="mut-s">${x[0]}</div><b class="num" style="font-size:18px">${num(x[1])}</b></div>`).join('')}</div></div></div>
    <div class="card"><div class="card-h"><h3>Meus dados</h3></div><div class="card-p">
      <p class="mut" style="margin-top:0">Exporte um arquivo com tudo que é seu: arenas, atletas, duplas, torneios e resultados.</p>
      <button class="btn btn-d" id="exp-org">Exportar meus dados</button></div></div>
  </div>`;
  shell(app, MENU_ORG, 'configuracoes', 'Configurações', esc(org.name), '', html);
  $('#cfg-pts').onclick = () => modalPontuacao();
  if ($('#salvar-senha')) $('#salvar-senha').onclick = async () => {
    const s = $('#np').value;
    if (s.length < 6) { toast('A senha precisa de pelo menos 6 caracteres.', 'err'); return; }
    if (Nuvem.pronto) {
      try { await Nuvem.trocarSenha(s); toast('Senha alterada.', 'ok'); $('#np').value = ''; }
      catch (e) { toast(e.message, 'err'); }
      return;
    }
    u.password = s; log('config', 'Alterou a própria senha'); saveDB(); toast('Senha alterada.', 'ok'); $('#np').value = '';
  };
  $('#exp-org').onclick = () => {
    const d = { organization: org };
    ['arenas', 'courts', 'athletes', 'teams', 'tournaments', 'matches', 'ranking_points'].forEach(t => d[t] = scoped(t, org.id));
    const blob = new Blob([JSON.stringify(d, null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'gbr-' + (org.slug || 'dados') + '-' + today() + '.json'; a.click();
    toast('Arquivo gerado.', 'ok');
  };
}

/* ---------------------------------------------------------------
   11.b ÁRBITROS — cadastro (organizador)
--------------------------------------------------------------- */
function arbitrosDoOrg(orgId) { return DB.users.filter(u => u.role === 'arbitro' && u.organizationId === orgId); }
function nomesQuadras(ids) {
  return (ids || []).map(id => Q.courtName(id)).filter(Boolean);
}
function formArbitro(u) {
  const arenas = Q.arenas();
  const quadras = Q.courts();
  if (!quadras.length) { toast('Cadastre uma arena com quadras antes de criar árbitros.', 'err'); return; }
  const sel = new Set(u ? (u.courtIds || []) : []);
  const naNuvem = Nuvem.pronto;
  const campos = [
    { k: 'name', label: 'Nome do árbitro', req: true, val: u && u.name },
    { k: 'login', label: 'Usuário', req: true, val: u && u.login, half: true, ph: 'arbitro1' },
    { k: 'password', label: naNuvem && u ? 'Nova senha (opcional)' : 'Senha', req: !(naNuvem && u),
      val: u ? (naNuvem ? '' : u.password) : 'quadra' + Math.floor(100 + Math.random() * 899), half: true }
  ];
  openModal(u ? 'Editar árbitro' : 'Novo árbitro',
    formHTML(campos) + `<div class="field"><label>Quadras que ele controla *</label>
      ${arenas.map(a => {
      const cs = quadras.filter(c => c.arenaId === a.id);
      if (!cs.length) return '';
      return `<div class="mut-s" style="text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin:10px 0 6px">${esc(a.name)}</div>
        <div class="chips">${cs.map(c => `<label class="chip" style="cursor:pointer">
          <input type="checkbox" value="${c.id}" ${sel.has(c.id) ? 'checked' : ''} style="margin-right:6px">${esc(c.name)}</label>`).join('')}</div>`;
    }).join('')}
      <div class="hint">O árbitro só enxerga os jogos das quadras marcadas. Pode marcar mais de uma.</div></div>`,
    `<button class="btn" data-close="1">Cancelar</button><button class="btn btn-p" id="ab-save">${u ? 'Salvar' : 'Criar acesso do árbitro'}</button>`,
    root => {
      $('#ab-save').onclick = async () => {
        const d = readForm(root, campos);
        const cts = $$('input[type=checkbox]', root).filter(c => c.checked).map(c => c.value);
        if (!d.name || !d.login || (!d.password && !(naNuvem && u))) { toast('Preencha nome, login e senha.', 'err'); return; }
        if (!cts.length) { toast('Marque pelo menos uma quadra.', 'err'); return; }
        if (naNuvem) {
          const bt = $('#ab-save'); bt.disabled = true; bt.textContent = 'Salvando...';
          try {
            await Nuvem.sincronizar();
            await Nuvem.funcao('criar-acesso', u
              ? { acao: 'atualizar', userId: u.id, login: d.login, senha: d.password || undefined, nome: d.name, courtIds: cts }
              : { acao: 'criar', papel: 'arbitro', organizationId: Sess.orgId, login: d.login, senha: d.password, nome: d.name, courtIds: cts });
            await Nuvem.carregar(); closeModal(); render();
            toast('Acesso do árbitro: ' + d.login + (d.password ? ' / ' + d.password : ''), 'ok');
          } catch (e) { toast(e.message, 'err'); bt.disabled = false; bt.textContent = u ? 'Salvar' : 'Criar acesso do árbitro'; }
          return;
        }
        const dup = DB.users.find(x => x.login.toLowerCase() === d.login.toLowerCase() && (!u || x.id !== u.id));
        if (dup) { toast('Já existe um usuário com esse login.', 'err'); return; }
        if (u) Object.assign(u, d, { courtIds: cts });
        else DB.users.push({
          id: uid('usr'), ...d, role: 'arbitro', organizationId: Sess.orgId,
          courtIds: cts, active: true, createdAt: Date.now()
        });
        log('árbitro', (u ? 'Editou ' : 'Criou ') + d.name); saveDB(); closeModal(); render();
        toast('Acesso do árbitro: ' + d.login + ' / ' + d.password, 'ok');
      };
    });
}
function oArbitros(app) {
  const lista = arbitrosDoOrg(Sess.orgId);
  const html = lista.length ? `<div class="card"><div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Árbitro</th><th>Usuário</th><th>Senha</th><th>Quadras</th><th>Situação</th><th></th></tr></thead><tbody>
      ${lista.map(u => `<tr>
        <td><div class="person">${avatar(null, u.name)}<b>${esc(u.name)}</b></div></td>
        <td class="num">${esc(u.login)}</td>
        <td class="num">${Nuvem.pronto ? '<span class="mut-s">guardada com segurança</span>' : esc(u.password)}</td>
        <td>${nomesQuadras(u.courtIds).map(n => `<span class="badge">${esc(n)}</span>`).join(' ') || '<span class="badge off">sem quadra</span>'}</td>
        <td>${statusBadge(u.active === false ? 'inativo' : 'ativo')}</td>
        <td class="right nowrap"><button class="btn btn-s" data-ed="${u.id}">Editar</button>
          <button class="btn btn-s" data-tog="${u.id}">${u.active === false ? 'Ativar' : 'Desativar'}</button>
          <button class="btn btn-s" data-del="${u.id}">Remover</button></td></tr>`).join('')}
      </tbody></table></div>
      <div class="card-p" style="border-top:1px solid var(--linha-f)">
        <p class="mut" style="margin:0">Cada árbitro entra na mesma tela de login com o acesso dele e cai direto na quadra: placar em botões grandes, só com os jogos daquela quadra. O que ele marca já atualiza a chave, a tela do público e o telão.</p></div></div>`
    : vazio('☗', 'Nenhum árbitro cadastrado', 'Crie um acesso para cada quadra. O árbitro marca o placar pelo celular e não enxerga o resto do sistema.',
      '<button class="btn btn-p" id="nv2">+ Novo árbitro</button>');
  shell(app, MENU_ORG, 'arbitros', 'Árbitros', esc(Sess.org().name), `<button class="btn btn-p" id="nv">+ Novo árbitro</button>`, html);
  $('#nv').onclick = () => formArbitro(); if ($('#nv2')) $('#nv2').onclick = () => formArbitro();
  $$('[data-ed]').forEach(b => b.onclick = () => formArbitro(DB.users.find(u => u.id === b.dataset.ed)));
  $$('[data-tog]').forEach(b => b.onclick = async () => {
    const u = DB.users.find(x => x.id === b.dataset.tog);
    const novo = u.active === false;
    if (Nuvem.pronto) {
      try {
        await Nuvem.funcao('criar-acesso', { acao: 'atualizar', userId: u.id, active: novo });
        await Nuvem.carregar(); render(); toast('Acesso ' + (novo ? 'ativado' : 'desativado') + '.', 'ok');
      } catch (e) { toast(e.message, 'err'); }
      return;
    }
    u.active = novo;
    log('árbitro', (u.active ? 'Ativou ' : 'Desativou ') + u.name); saveDB(); render();
  });
  $$('[data-del]').forEach(b => b.onclick = () => {
    const u = DB.users.find(x => x.id === b.dataset.del);
    confirmar('Remover árbitro', `Remover o acesso de ${esc(u.name)}?`, async () => {
      if (Nuvem.pronto) {
        try {
          await Nuvem.funcao('criar-acesso', { acao: 'remover', userId: u.id });
          await Nuvem.carregar(); render(); toast('Acesso removido.', 'ok');
        } catch (e) { toast(e.message, 'err'); }
        return;
      }
      DB.users = DB.users.filter(x => x.id !== u.id); log('árbitro', 'Removeu ' + u.name); saveDB(); render();
    }, 'Remover');
  });
}

/* ---------------------------------------------------------------
   11.c TELA DO ÁRBITRO — uma quadra, placar em botões grandes
--------------------------------------------------------------- */
let ArbQuadra = null;
function viewArbitro(app) {
  const u = Sess.user;
  const minhas = Q.courts().filter(c => (u.courtIds || []).includes(c.id));
  const sair = () => confirmar('Sair', 'Você será desconectado deste navegador.', () => Sess.logout(), 'Sair');
  if (!minhas.length) {
    app.innerHTML = `<div class="arb"><div class="arb-in">
      <div class="arb-top"><div class="brand"><div class="brand-mark">G</div><div class="brand-name">GBR Connect<small>Árbitro</small></div></div>
        <button class="btn-big" id="ab-sair" style="padding:8px 14px;font-size:13px">Sair</button></div>
      <div class="arb-card" style="padding:26px 20px;text-align:center">
        <h3 style="font-size:22px;text-transform:uppercase">Nenhuma quadra vinculada</h3>
        <p style="color:rgba(255,255,255,.6)">Peça ao organizador para vincular você a uma quadra em Árbitros.</p></div>
    </div></div>`;
    $('#ab-sair').onclick = sair; return;
  }
  if (!ArbQuadra || !minhas.some(c => c.id === ArbQuadra)) ArbQuadra = minhas[0].id;
  const quadra = Q.courts().find(c => c.id === ArbQuadra);
  const arena = Q.arenas().find(a => a.id === quadra.arenaId);
  const emQuadra = Q.matches().find(m => m.courtId === ArbQuadra && m.status === 'andamento');
  const fila = Q.matches().filter(m => m.courtId === ArbQuadra && m.status === 'aguardando' && m.teamAId && m.teamBId);
  const ultimos = Q.matches().filter(m => m.courtId === ArbQuadra && m.status === 'finalizado' && !m.bye)
    .sort((a, b) => (b.finishedAt || 0) - (a.finishedAt || 0)).slice(0, 4);
  const lado = (m, letra) => {
    const id = m['team' + letra + 'Id'], sc = m['score' + letra] || 0;
    const outro = m['score' + (letra === 'A' ? 'B' : 'A')] || 0;
    return `<div class="arb-time">
      <button class="arb-bt menos" data-dec="${letra}">−</button>
      <div class="nm" style="${sc >= outro ? '' : 'opacity:.75'}">${esc(Q.teamShort(id))}<small>${esc(Q.teamName(id))}</small></div>
      <div class="arb-pt">${sc}</div>
      <button class="arb-bt" data-inc="${letra}">+</button></div>`;
  };
  app.innerHTML = `<div class="arb"><div class="arb-in">
    <div class="arb-top">
      <div><div class="mut-s" style="color:rgba(255,255,255,.45);letter-spacing:.18em;text-transform:uppercase;font-weight:700;font-size:10px">${esc(arena ? arena.name : '')}</div>
        <div style="font-family:var(--disp);font-size:26px;text-transform:uppercase">${esc(quadra.name)}</div></div>
      <button class="btn-big" id="ab-sair" style="padding:9px 14px;font-size:13px">Sair</button></div>
    ${minhas.length > 1 ? `<div class="chips" style="margin-bottom:14px">${minhas.map(c =>
    `<span class="chip ${c.id === ArbQuadra ? 'on' : ''}" data-q="${c.id}" style="${c.id === ArbQuadra ? '' : 'background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:#fff'}">${esc(c.name)}</span>`).join('')}</div>` : ''}
    ${emQuadra ? `<div class="arb-card">
        <div class="arb-h"><span>${esc(nomeTorneio(emQuadra.tournamentId))} · ${esc(emQuadra.label)}</span>
          <span class="live-tag"><span class="dot"></span>AO VIVO</span></div>
        ${lado(emQuadra, 'A')}${lado(emQuadra, 'B')}
        <div class="arb-acao">
          <button class="btn-big" id="ab-pausar">Tirar da quadra</button>
          <button class="btn-big ok" id="ab-encerrar">Encerrar partida</button></div></div>`
      : `<div class="arb-card" style="padding:22px 18px;text-align:center">
        <h3 style="font-size:20px;text-transform:uppercase">Nenhum jogo em quadra</h3>
        <p style="color:rgba(255,255,255,.6);margin:6px 0 0">Escolha abaixo o próximo jogo desta quadra.</p></div>`}
    <div class="sec-cap">Fila desta quadra</div>
    ${fila.length ? fila.map(m => `<div class="arb-fila"><div class="t">${esc(Q.teamShort(m.teamAId))} <span style="opacity:.4">x</span> ${esc(Q.teamShort(m.teamBId))}
        <small>${esc(nomeTorneio(m.tournamentId))} · ${esc(m.label)}</small></div>
        <button class="btn-big p" style="padding:10px 14px;font-size:13px" data-iniciar="${m.id}">Iniciar</button></div>`).join('')
      : '<div class="arb-fila"><div class="t" style="opacity:.6">Nenhum jogo agendado nesta quadra.</div></div>'}
    <button class="btn-big" id="ab-chamar" style="width:100%;margin-top:6px">+ Chamar jogo para esta quadra</button>
    ${ultimos.length ? `<div class="sec-cap">Últimos resultados desta quadra</div>
      <div class="pub-card">${ultimos.map(m => `<div class="row-jogo"><div class="t">
        <span class="${m.winnerId === m.teamAId ? 'win-nm' : ''}">${esc(Q.teamShort(m.teamAId))}</span>
        <span style="opacity:.4"> x </span>
        <span class="${m.winnerId === m.teamBId ? 'win-nm' : ''}">${esc(Q.teamShort(m.teamBId))}</span>
        <small>${esc(m.label)}</small></div><div class="r">${placarCor(m)}</div></div>`).join('')}</div>` : ''}
    <div class="pub-foot">Marcou aqui, atualizou na hora para o público e no telão.</div>
  </div></div>`;
  $('#ab-sair').onclick = sair;
  $$('[data-q]').forEach(c => c.onclick = () => { ArbQuadra = c.dataset.q; render(); });
  const ajusta = (letra, delta) => {
    if (!emQuadra) return;
    const k = 'score' + letra;
    emQuadra[k] = Math.max(0, (emQuadra[k] || 0) + delta);
    emQuadra.status = 'andamento';
    saveDB(); render();
  };
  $$('[data-inc]').forEach(b => b.onclick = () => ajusta(b.dataset.inc, 1));
  $$('[data-dec]').forEach(b => b.onclick = () => ajusta(b.dataset.dec, -1));
  if ($('#ab-encerrar')) $('#ab-encerrar').onclick = () => {
    const a = emQuadra.scoreA || 0, b = emQuadra.scoreB || 0;
    if (a === b) { toast('O placar está empatado — ajuste antes de encerrar.', 'err'); return; }
    confirmar('Encerrar partida', `${esc(Q.teamShort(emQuadra.teamAId))} ${a} x ${b} ${esc(Q.teamShort(emQuadra.teamBId))}. Confirma o resultado?`,
      () => { if (setResult(emQuadra.id, a, b)) { render(); toast('Resultado enviado. Chave atualizada.', 'ok'); } }, 'Confirmar resultado');
  };
  if ($('#ab-pausar')) $('#ab-pausar').onclick = () => {
    emQuadra.status = 'aguardando'; saveDB(); render(); toast('Jogo voltou para a fila.', '');
  };
  $$('[data-iniciar]').forEach(b => b.onclick = () => {
    const m = Q.matches().find(x => x.id === b.dataset.iniciar);
    if (emQuadra) { toast('Encerre o jogo que está em quadra antes de iniciar outro.', 'err'); return; }
    m.status = 'andamento'; m.scoreA = 0; m.scoreB = 0;
    const t = DB.tournaments.find(x => x.id === m.tournamentId);
    if (t && t.status === 'aberto') t.status = 'andamento';
    saveDB(); render(); toast('Jogo iniciado.', 'ok');
  });
  $('#ab-chamar').onclick = () => {
    const disp = Q.matches().filter(m => m.status === 'aguardando' && m.teamAId && m.teamBId && m.courtId !== ArbQuadra)
      .filter(m => { const t = DB.tournaments.find(x => x.id === m.tournamentId); return t && t.arenaId === quadra.arenaId; });
    openModal('Chamar jogo para ' + quadra.name,
      disp.length ? `<div style="max-height:52vh;overflow:auto">${disp.map(m => `<div class="dp-i" data-call="${m.id}">
          <div style="flex:1;min-width:0"><b>${esc(Q.teamShort(m.teamAId))} x ${esc(Q.teamShort(m.teamBId))}</b>
          <span class="mut-s">${esc(nomeTorneio(m.tournamentId))} · ${esc(m.label)}${m.courtId ? ' · hoje em ' + esc(Q.courtName(m.courtId)) : ''}</span></div>
          <span class="badge">chamar</span></div>`).join('')}</div>`
        : '<p class="mut" style="margin:0">Nenhum jogo liberado nesta arena no momento.</p>',
      `<button class="btn" data-close="1">Fechar</button>`,
      root => {
        $$('[data-call]', root).forEach(el => el.onclick = () => {
          const m = Q.matches().find(x => x.id === el.dataset.call);
          m.courtId = ArbQuadra;
          if (!emQuadra) { m.status = 'andamento'; m.scoreA = 0; m.scoreB = 0; }
          saveDB(); closeModal(); render(); toast('Jogo chamado para ' + quadra.name + '.', 'ok');
        });
      });
  };
}

/* ---------------------------------------------------------------
   11.d TELÃO — tela do evento para o televisor da arena
--------------------------------------------------------------- */
let TelaoTimer = null, TelaoAba = 0;
const TELAO_ABAS = [['vivo', 'Placar ao vivo', 14], ['chave', 'Chaveamento e categorias', 20], ['tabela', 'Classificação e próximos jogos', 14]];
function pubTelao(app, slug) {
  const ev = DB.events.find(x => x.slug === slug || x.id === slug);
  let t = DB.tournaments.find(x => x.slug === slug || x.id === slug);
  if (!t && !ev) return pubNaoEncontrado(app, 'Confira o endereço do telão com o organizador.');
  let ms;
  if (ev) {
    const ids = DB.tournaments.filter(x => x.eventId === ev.id).map(x => x.id);
    ms = DB.matches.filter(m => ids.includes(m.tournamentId) && !m.dead).sort((a, b) => a.seq - b.seq);
    t = { id: ev.id, name: ev.name, arenaId: ev.arenaId, organizationId: ev.organizationId, slug: ev.slug,
          status: ms.some(m => m.status === 'andamento') ? 'andamento' : ev.status, standings: null, pointsConfig: null, teamIds: [] };
  }
  const arena = DB.arenas.find(a => a.id === t.arenaId);
  const org = DB.organizations.find(o => o.id === t.organizationId);
  if (!ev) ms = DB.matches.filter(m => m.tournamentId === t.id && !m.dead).sort((a, b) => a.seq - b.seq);
  const aba = TELAO_ABAS[TelaoAba % TELAO_ABAS.length];
  const corpo = aba[0] === 'vivo' ? telaoVivo(ms)
    : aba[0] === 'chave' ? (ev ? telaoCategorias(ev, ms) : `<div class="tv-fit" id="tv-fit">${renderBracket(ms, true)}</div>`)
      : telaoTabela(t, ms);
  app.innerHTML = `<div class="tv">
    <div class="tv-top">
      <div><div class="sub">${esc(org ? org.name : '')} · ${esc(arena ? arena.name : '')}</div><h1>${esc(t.name)}</h1></div>
      <div style="display:flex;align-items:center;gap:14px">
        ${t.status === 'andamento' ? '<span class="live-tag"><span class="dot"></span>AO VIVO</span>' : ''}
        <div class="tv-ctrl"><button id="tv-prev">‹</button><button id="tv-next">›</button><button id="tv-full">⛶</button></div></div>
    </div>
    <div class="tv-body"><div class="tv-cap">${esc(aba[1])}</div>${corpo}
      <div class="tv-qr"><canvas id="tv-qr"></canvas><span>ACOMPANHE NO CELULAR</span></div></div>
    <div class="tv-bar"><i id="tv-prog"></i></div></div>`;
  const link = location.href.split('#')[0] + (ev ? '#/e/' : '#/t/') + t.slug;
  if ($('#tv-qr')) drawQR($('#tv-qr'), link, 4, 2);
  const prog = $('#tv-prog');
  if (prog) { prog.style.transition = 'none'; prog.style.width = '0'; setTimeout(() => { prog.style.transition = 'width ' + aba[2] + 's linear'; prog.style.width = '100%'; }, 60); }
  const fit = $('#tv-fit');
  if (fit) {
    const cx = fit.parentElement.clientWidth, cy = fit.parentElement.clientHeight - 40;
    const k = Math.min(1, cx / Math.max(1, fit.scrollWidth), cy / Math.max(1, fit.scrollHeight));
    if (k < 1) { fit.style.transform = 'scale(' + k + ')'; fit.style.width = (100 / k) + '%'; }
  }
  const vai = d => { TelaoAba = (TelaoAba + d + TELAO_ABAS.length) % TELAO_ABAS.length; render(); };
  $('#tv-prev').onclick = () => vai(-1); $('#tv-next').onclick = () => vai(1);
  $('#tv-full').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  };
  TelaoTimer = setTimeout(() => vai(1), aba[2] * 1000);
}
function telaoVivo(ms) {
  const ao = ms.filter(m => m.status === 'andamento');
  const prox = ms.filter(m => m.status === 'aguardando').slice(0, 6);
  const ult = ms.filter(m => m.status === 'finalizado' && !m.bye).sort((a, b) => (b.finishedAt || 0) - (a.finishedAt || 0)).slice(0, 6);
  const pl = m => {
    const a = m.scoreA || 0, b = m.scoreB || 0;
    return `<div class="tv-pl"><div class="h"><span>${m.courtId ? esc(Q.courtName(m.courtId)) : 'quadra a definir'}</span><span>${esc(m.label)}</span></div>
      <div class="l ${a >= b ? 'lead' : ''}"><div class="nm">${esc(Q.teamShort(m.teamAId))}</div><div class="sc">${a}</div></div>
      <div class="l ${b >= a ? 'lead' : ''}"><div class="nm">${esc(Q.teamShort(m.teamBId))}</div><div class="sc">${b}</div></div></div>`;
  };
  if (!ao.length) {
    return `<div class="tv-grid" style="grid-template-columns:1fr 1fr">
      <div><div class="tv-cap">Próximos jogos</div><div class="tv-list">${prox.length ? prox.map(m => `<div class="r">
        <span>${esc(Q.teamShort(m.teamAId))} x ${esc(Q.teamShort(m.teamBId))}</span><b>${esc(m.time || (m.courtId ? Q.courtName(m.courtId) : '—'))}</b></div>`).join('')

      <div><div class="tv-cap">Últimos resultados</div><div class="tv-list">${ult.length ? ult.map(m => `<div class="r">

      : '<div class="r"><span>Nenhum jogo finalizado ainda.</span></div>'}</div></div></div>`;
  }
  return `<div class="tv-grid" style="grid-template-columns:repeat(${ao.length > 1 ? 2 : 1},1fr)">${ao.slice(0, 4).map(pl).join('')}</div>
    ${prox.length ? `<div class="tv-cap" style="margin-top:14px">A seguir</div><div class="tv-list">${prox.slice(0, 3).map(m => `<div class="r">
      <span>${esc(Q.teamShort(m.teamAId))} x ${esc(Q.teamShort(m.teamBId))}</span><b>${esc(m.time || (m.courtId ? Q.courtName(m.courtId) : '—'))}</b></div>`).join('')}</div>` : ''}`;
}
function telaoCategorias(ev, ms) {
  const cats = DB.tournaments.filter(x => x.eventId === ev.id).sort((a, b) => String(a.name).localeCompare(String(b.name)));
  return `<div class="tv-list">${cats.map(c => {
    const mc = ms.filter(m => m.tournamentId === c.id);
    const fim = mc.filter(m => m.status === 'finalizado').length;
    const campeao = c.standings && c.standings.length ? '🏆 ' + Q.teamShort(c.standings[0].teamId) : (mc.length ? fim + '/' + mc.length + ' jogos' : 'chave a gerar');
    return `<div class="r"><span>${esc(c.name)} <span style="opacity:.5">· ${(c.teamIds || []).length} duplas</span></span><b>${esc(campeao)}</b></div>`;

}
function telaoTabela(t, ms) {
  if (t.standings && t.standings.length) {
    return `<div class="tv-list">${t.standings.slice(0, 10).map(s => `<div class="r">
      <span>${s.pos <= 3 ? TROFEU[s.pos - 1] + ' ' : '<b style="color:var(--txt-3)">' + s.pos + 'º</b> '}${esc(Q.teamName(s.teamId))}</span>
      <b>${num(pointsFor(t.pointsConfig || defaultPoints(), s.pos))} pts</b></div>`).join('')}</div>`;
  }
  const vivos = (t.teamIds || []).map(id => ({
    id, der: ms.filter(m => m.status === 'finalizado' && m.loserId === id).length,
    v: ms.filter(m => m.winnerId === id && !m.bye).length
  })).sort((a, b) => a.der - b.der || b.v - a.v).slice(0, 10);
  const prox = ms.filter(m => m.status === 'aguardando').slice(0, 8);
  return `<div class="tv-grid" style="grid-template-columns:1.2fr 1fr">
    <div><div class="tv-cap">Situação das duplas</div><div class="tv-list">${vivos.map(x => `<div class="r">
      <span>${esc(Q.teamName(x.id))}</span><b style="color:${x.der >= 2 ? 'var(--vermelho)' : x.der === 1 ? 'var(--dourado)' : 'var(--verde)'}">${x.v}V · ${x.der}D</b></div>`).join('')}</div></div>
    <div><div class="tv-cap">Próximos jogos</div><div class="tv-list">${prox.length ? prox.map(m => `<div class="r">
      <span>${esc(Q.teamShort(m.teamAId))} x ${esc(Q.teamShort(m.teamBId))}</span><b>${esc(m.courtId ? Q.courtName(m.courtId) : (m.time || '—'))}</b></div>`).join('')
      : '<div class="r"><span>Aguardando a próxima rodada.</span></div>'}</div></div></div>`;
}

/* aba só fica clicável quando existe conteúdo; as outras aparecem apagadas */
function abaValida(abas, atual) {
  const achou = abas.find(a => a[0] === atual && a[2] !== false);
  if (achou) return atual;
  const primeira = abas.find(a => a[2] !== false);
  return primeira ? primeira[0] : abas[abas.length - 1][0];
}
function abasHTML(abas, atual, href) {
  return abas.map(a => a[2] === false
    ? `<span class="pub-tab off" title="ainda sem informação">${a[1]}</span>`
    : `<a class="pub-tab ${atual === a[0] ? 'on' : ''}" href="${href(a[0])}">${a[1]}</a>`).join('');
}
function abasAdminHTML(abas, atual, href) {
  return abas.map(a => a[2] === false
    ? `<span class="tab off" title="ainda sem informação">${a[1]}</span>`
    : `<a class="tab ${atual === a[0] ? 'on' : ''}" href="${href(a[0])}">${a[1]}</a>`).join('');
}

        <div class="p"><div style="font-size:22px">🥈</div><div class="pos">2</div><div class="nm">${esc(Q.teamShort(podio[1].teamId))}</div></div>
        <div class="p p1"><div style="font-size:28px">🏆</div><div class="pos">1</div><div class="nm">${esc(Q.teamShort(podio[0].teamId))}</div><div class="pt">campeão</div></div>
        <div class="p"><div style="font-size:22px">🥉</div><div class="pos">3</div><div class="nm">${esc(Q.teamShort(podio[2].teamId))}</div></div></div>` : ''}
      <div class="pub-card">${st.map(s => `<div class="row-jogo"><div class="t"><b>${s.pos}º</b> ${esc(Q.teamName(s.teamId))}</div>
        <div class="r">${num(pointsFor(t.pointsConfig || defaultPoints(), s.pos))} pts</div></div>`).join('')}</div>`;
  }
  const vivos = (t.teamIds || []).map(id => ({
    id, der: ms.filter(m => m.status === 'finalizado' && m.loserId === id).length,
    v: ms.filter(m => m.winnerId === id && !m.bye).length
  })).sort((a, b) => a.der - b.der || b.v - a.v);
  if (!vivos.length) return `<div class="pub-card"><p style="color:var(--txt-2);margin:0">Sem duplas inscritas ainda.</p></div>`;
  return `<div class="sec-cap">Situação atual</div><div class="pub-card">
    ${vivos.map(x => `<div class="row-jogo"><div class="t">${esc(Q.teamName(x.id))}<small>${x.v} vitórias · ${x.der} derrotas</small></div>
      <div class="r" style="font-size:11px;letter-spacing:.1em">${x.der >= 2 ? 'ELIMINADA' : x.der === 1 ? 'LOSERS' : 'INVICTA'}</div></div>`).join('')}</div>`;
}
function pubParticipantes(t) {
  const duplas = (t.teamIds || []).map(id => Q.team(id)).filter(Boolean);
  if (!duplas.length) return `<div class="pub-card"><p style="color:var(--txt-2);margin:0">As duplas ainda não foram divulgadas.</p></div>`;
  return `<div class="sec-cap">${pl(duplas.length, 'dupla')}</div>
    <div class="pub-card" style="padding:6px 16px">${duplas.map((d, i) => `<div class="row-jogo">
      <div class="t" style="display:flex;gap:12px;align-items:center">
        <span class="num" style="color:var(--txt-3);min-width:22px">${i + 1}</span>
        <b>${esc(Q.teamName(d.id))}</b></div></div>`).join('')}</div>`;
}
function pubInfo(t, org, arena) {
  return `<div class="sec-cap">Informações</div>
    <div class="pub-card"><div class="pill-list">
      <span class="pill"><b>organizador</b>${esc(org ? org.name : '—')}</span>
      <span class="pill"><b>arena</b>${esc(arena ? arena.name : '—')}</span>
      <span class="pill"><b>data</b>${esc(fmtDate(t.date))}${t.time ? ' · ' + esc(t.time) : ''}</span>
      <span class="pill"><b>categoria</b>${esc(t.category || '—')}</span>
      <span class="pill"><b>formato</b>Eliminatória dupla</span>
      ${t.fee ? `<span class="pill"><b>inscrição</b>R$ ${esc(t.fee)}</span>` : ''}
    </div>
    ${t.description ? `<p style="color:var(--txt);margin:16px 0 0">${esc(t.description)}</p>` : ''}</div>
    ${t.rules ? `<div class="sec-cap">Regulamento</div><div class="pub-card">
      <p style="color:var(--txt);margin:0;white-space:pre-wrap">${esc(t.rules)}</p></div>` : ''}
    ${arena ? `<div class="sec-cap">Onde é</div><div class="pub-card">
      <h3>${esc(arena.name)}</h3>
      <p style="color:var(--txt-2);margin:6px 0 0">${esc([arena.address, arena.city, arena.state].filter(Boolean).join(' · ') || 'endereço não informado')}</p>
      ${arena.phone ? `<p style="color:var(--txt-2);margin:4px 0 0">${esc(arena.phone)}</p>` : ''}
      <a class="pub-tab" style="display:inline-block;margin-top:12px" href="#/arena/${arena.id}">Ver a arena →</a></div>` : ''}`;
}
function pubArena(app, id) {
  const a = DB.arenas.find(x => x.id === id);
  if (!a) return pubNaoEncontrado(app, 'Essa arena não está mais disponível.');
  const s = orgStats(a.organizationId, { arenaId: a.id });
  const org = DB.organizations.find(o => o.id === a.organizationId);
  const ts = DB.tournaments.filter(t => t.arenaId === a.id).sort((x, y) => String(y.date).localeCompare(String(x.date)));
  const prox = ts.filter(t => t.status !== 'finalizado'), ant = ts.filter(t => t.status === 'finalizado');
  const lista = arr => `<div class="pub-card">${arr.map(t => `<div class="row-jogo"><div class="t">${esc(t.name)}
      <small>${esc(fmtDate(t.date))}${t.category ? ' · ' + esc(t.category) : ''}</small></div>
      <a class="pub-tab" href="#/t/${t.slug}">abrir</a></div>`).join('')}</div>`;
  app.innerHTML = pubShell(`
    <div class="pub-hero"><div class="eyebrow">${esc(org ? org.name : '')}</div><h1>${esc(a.name)}</h1>
      <div class="pub-meta"><span class="m">${esc([a.address, a.city, a.state].filter(Boolean).join(' · ') || 'endereço não informado')}</span>
        ${a.phone ? `<span class="m">${esc(a.phone)}</span>` : ''}${a.instagram ? `<span class="m">${esc(a.instagram)}</span>` : ''}</div></div>
    <div class="pub-card"><div class="pill-list">
      <span class="pill"><b>torneios</b>${num(s.tournaments)}</span><span class="pill"><b>atletas</b>${num(s.athletes)}</span>
      <span class="pill"><b>duplas</b>${num(s.teams)}</span><span class="pill"><b>jogos</b>${num(s.matches)}</span>
      <span class="pill"><b>quadras</b>${DB.courts.filter(c => c.arenaId === a.id).length}</span></div>
      ${a.description ? `<p style="color:var(--txt);margin:16px 0 0">${esc(a.description)}</p>` : ''}</div>
    ${prox.length ? `<div class="sec-cap">Próximos torneios</div>${lista(prox)}` : ''}
    ${ant.length ? `<div class="sec-cap">Torneios anteriores</div>${lista(ant)}` : ''}`);
}
function pubOrganizador(app, slug) {
  const o = DB.organizations.find(x => x.slug === slug || x.id === slug);
  if (!o) return pubNaoEncontrado(app, 'Esse organizador não está disponível.');
  const s = orgStats(o.id, {});
  const arenas = scoped('arenas', o.id);
  const ts = scoped('tournaments', o.id).sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const rank = ranking(o.id, {}).slice(0, 10);
  app.innerHTML = pubShell(`
    <div class="pub-hero"><div class="eyebrow">Organizador</div><h1>${esc(o.name)}</h1>
      <div class="pub-meta"><span class="m">${num(s.arenas)} arenas</span><span class="m">${num(s.tournaments)} torneios</span>
        <span class="m">${num(s.athletes)} atletas</span><span class="m">${num(s.matches)} jogos</span></div></div>
    ${arenas.length ? `<div class="sec-cap">Arenas</div><div class="pub-card">${arenas.map(a => `<div class="row-jogo">
      <div class="t">${esc(a.name)}<small>${esc([a.city, a.state].filter(Boolean).join('/'))}</small></div>
      <a class="pub-tab" href="#/arena/${a.id}">abrir</a></div>`).join('')}</div>` : ''}
    ${ts.length ? `<div class="sec-cap">Torneios</div><div class="pub-card">${ts.slice(0, 12).map(t => `<div class="row-jogo">
      <div class="t">${esc(t.name)}<small>${esc(fmtDate(t.date))} · ${esc(Q.arenaName(t.arenaId))}</small></div>
      <a class="pub-tab" href="#/t/${t.slug}">abrir</a></div>`).join('')}</div>` : ''}
    ${rank.length ? `<div class="sec-cap">Ranking</div><div class="pub-card">${rank.map((x, i) => `<div class="row-jogo">
      <div class="t" style="display:flex;align-items:center;gap:10px">
        <span style="width:26px;text-align:center;font-size:${i < 3 ? '17px' : '13px'};font-family:var(--mono)">${i < 3 ? TROFEU[i] : (i + 1)}</span>
        <span class="av" style="background:var(--areia-2);color:var(--tinta);width:32px;height:32px;font-size:13px">${x.atleta.photo ? `<img src="${x.atleta.photo}" alt="">` : esc(initials(x.atleta.name))}</span>
        <span>${esc(x.atleta.name)}<small>${codigoAtleta(x.atleta)} · ${x.torneios} torneios · ${x.titulos} títulos</small></span></div>
      <div class="r">${num(x.pontos)}</div></div>`).join('')}</div>` : ''}`);
}
function pubAtleta(app, id) {
  const a = DB.athletes.find(x => x.id === id);
  if (!a) return pubNaoEncontrado(app, 'Esse atleta não está disponível.');
  const r = athleteRecord(a.id);
  const org = DB.organizations.find(o => o.id === a.organizationId);
  const hist = r.historico.slice().sort((x, y) => String(y.date).localeCompare(String(x.date)));
  const porArena = {};
  hist.forEach(h => { const k = h.arenaId; (porArena[k] = porArena[k] || { t: 0, p: 0 }); porArena[k].t++; porArena[k].p += h.points; });
  app.innerHTML = pubShell(`
    <div class="pub-hero"><div class="eyebrow">${esc(org ? org.name : '')}</div>
      <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
        <div class="av xl" style="background:var(--areia-2);color:#fff">${a.photo ? `<img src="${a.photo}" alt="">` : esc(initials(a.name))}</div>
        <div><h1 style="margin:0">${esc(a.name)}</h1>
        <div class="pub-meta" style="margin-top:8px">${a.category ? `<span class="m">${esc(a.category)}</span>` : ''}
          ${a.instagram ? `<span class="m">${esc(a.instagram)}</span>` : ''}</div></div></div></div>
    <div class="pub-card"><div class="pill-list">
      <span class="pill"><b>pontos</b>${num(r.pontos)}</span><span class="pill"><b>torneios</b>${r.torneios}</span>
      <span class="pill"><b>títulos</b>${r.titulos}</span><span class="pill"><b>vitórias</b>${r.v}</span>
      <span class="pill"><b>derrotas</b>${r.d}</span><span class="pill"><b>aproveitamento</b>${r.apr}%</span></div></div>
    ${hist.length ? `<div class="sec-cap">Histórico por torneio</div><div class="pub-card">
      ${hist.map(h => `<div class="row-jogo"><div class="t">${esc(h.tournamentName || nomeTorneio(h.tournamentId))}
        <small>${esc(fmtDate(h.date))} · ${esc(Q.arenaName(h.arenaId))}</small></div>
        <div class="r">${h.position}º · ${num(h.points)} pts</div></div>`).join('')}</div>` : ''}
    ${Object.keys(porArena).length ? `<div class="sec-cap">Desempenho por arena</div><div class="pub-card">
      ${Object.keys(porArena).map(k => `<div class="row-jogo"><div class="t">${esc(Q.arenaName(k))}<small>${porArena[k].t} torneios</small></div>
        <div class="r">${num(porArena[k].p)} pts</div></div>`).join('')}</div>` : ''}`);
}

/* ---------------------------------------------------------------
   13. TEMPO REAL — o público não precisa apertar F5
--------------------------------------------------------------- */
let ultimoPing = localStorage.getItem('gbr_ping') || '';
function ehPublico() { const p = rotaAtual(); return ['t', 'arena', 'perfil', 'atleta', 'tv'].includes(p[0]); }
function ehAoVivo() {
  if ($('#modal-root').innerHTML) return false;
  if (ehPublico()) return true;
  if (Sess.isArbitro()) return true;
  const p = rotaAtual();
  return p[0] === 'org' && ['dashboard', 'partidas', 'torneio'].includes(p[1] || 'dashboard');
}
function checarAtualizacao() {
  const p = localStorage.getItem('gbr_ping') || '';
  if (p !== ultimoPing) {
    ultimoPing = p;
    if (ehAoVivo()) { loadDB(); if (Sess.user) Sess.load(); render(); }
  }
}
window.addEventListener('storage', e => { if (e.key === 'gbr_ping' || e.key === DB_KEY) checarAtualizacao(); });
let puxando = false;
setInterval(async () => {
  if (Nuvem.pronto) {
    if (!ehAoVivo() || puxando || Nuvem.salvando) return;
    puxando = true;
    try { if (await Nuvem.puxar()) render(); } catch (e) { } finally { puxando = false; }
    return;
  }
  if (ehAoVivo()) checarAtualizacao();
}, 2500);

/* ---------------------------------------------------------------
   14. INICIALIZAÇÃO
--------------------------------------------------------------- */
function telaCarregando(msg) {
  return `<div class="pub" style="display:grid;place-items:center;min-height:100vh"><div style="text-align:center">
    <div class="brand" style="justify-content:center"><div class="brand-mark">G</div>
      <div class="brand-name" style="color:var(--tinta)">GBR Connect<small style="color:var(--txt-3)">Plataforma de torneios</small></div></div>
    <p class="mut" style="margin-top:18px">${esc(msg || 'Conectando à nuvem...')}</p></div></div>`;
}
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { }));
}
(async function iniciar() {
  Nuvem.iniciarCfg();
  if (!location.hash) location.hash = '#/login';
  if (Nuvem.ativo()) {
    $('#app').innerHTML = telaCarregando();
    try {
      const t = JSON.parse(localStorage.getItem(TOK_KEY) || 'null');
      if (t && t.r) { Nuvem.refresh = t.r; await Nuvem.renovar(); }
      await Nuvem.carregar();
      if (Nuvem.uid) {
        const perfil = DB.users.find(u => u.id === Nuvem.uid);
        if (perfil && perfil.active !== false) {
          Sess.user = perfil;
          Sess.orgId = perfil.role === 'master' ? null : perfil.organizationId;
          const sv = JSON.parse(localStorage.getItem(SESS_KEY) || 'null');
          if (sv && perfil.role === 'master' && sv.impersonating && sv.orgId) { Sess.orgId = sv.orgId; Sess.impersonating = true; }
        } else { Nuvem.sair(); }
      }
    } catch (e) {
      Nuvem.erro = e.message;
      DB = emptyDB();
      Nuvem.pronto = false;
    }
  } else { loadDB(); Sess.load(); }
  render();
})();
</script>
