<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GBR Connect — Gestão de Torneios</title>
<meta name="theme-color" content="#0E2436">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GBR Connect">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icone-192.png">
<link rel="icon" href="./icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --areia:#F4EDE1; --areia-2:#EAE0CF; --papel:#FFFFFF;
  --tinta:#0E2436; --tinta-2:#1B3E56; --tinta-3:#4A6B82;
  --coral:#FF5A36; --coral-d:#E1441F;
  --verde:#0E9F6E; --dourado:#EFA400; --vermelho:#D2321F; --azul:#2F73B8;
  --linha:rgba(14,36,54,.13); --linha-f:rgba(14,36,54,.07);
  --txt:#0E2436; --txt-2:#5A6E7E; --txt-3:#8B9BA7;
  --disp:'Barlow Condensed', 'Arial Narrow', Impact, sans-serif;
  --body:'Inter', ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace;
  --r:14px; --r-s:9px;
  --sh:0 1px 2px rgba(14,36,54,.06), 0 8px 24px -12px rgba(14,36,54,.18);
  --sh-l:0 18px 50px -18px rgba(14,36,54,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--body);background:var(--areia);color:var(--txt);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-family:var(--disp);font-weight:700;letter-spacing:.01em;line-height:1.05}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(14,36,54,.2);border-radius:8px;border:3px solid transparent;background-clip:padding-box}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ LOGIN ============ */
.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}
.login-art{background:var(--tinta);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-art:after{content:"";position:absolute;inset:auto -20% -35% -20%;height:70%;background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 46px);
  transform:skewY(-8deg)}
.login-art .net{position:absolute;right:-60px;top:-60px;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(255,90,54,.35),transparent 60%)}
.brand{display:flex;align-items:center;gap:12px;position:relative;z-index:2}
.brand-mark{width:44px;height:44px;border-radius:12px;background:var(--coral);display:grid;place-items:center;
  font-family:var(--disp);font-size:24px;color:#fff;box-shadow:0 8px 20px -6px rgba(255,90,54,.7)}
.brand-name{font-family:var(--disp);font-size:24px;letter-spacing:.06em;text-transform:uppercase}
.brand-name small{display:block;font-family:var(--body);font-size:10px;letter-spacing:.28em;opacity:.6;font-weight:600}
.login-art h1{font-size:clamp(40px,5vw,66px);text-transform:uppercase;position:relative;z-index:2;max-width:12ch}
.login-art h1 em{font-style:normal;color:var(--coral)}
.login-art p{position:relative;z-index:2;color:rgba(255,255,255,.7);max-width:44ch}
.login-stats{display:flex;gap:26px;position:relative;z-index:2;flex-wrap:wrap}
.login-stats div span{display:block;font-family:var(--mono);font-size:21px;color:var(--dourado)}
.login-stats div small{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.login-art .eyebrow{position:relative;z-index:2;font-size:11px;letter-spacing:.28em;text-transform:uppercase;
  color:var(--coral);font-weight:700;margin-bottom:10px}
.tag-linha{display:flex;flex-wrap:wrap;gap:6px;position:relative;z-index:2;margin-top:16px}
.tagx{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);padding:5px 11px;border-radius:99px;
  font-size:11.5px;color:rgba(255,255,255,.82);font-weight:600;white-space:nowrap}
.tagx.forte{background:var(--coral);border-color:var(--coral);color:#fff;letter-spacing:.1em;font-weight:800}
.login-para{position:relative;z-index:2;margin-top:20px;display:grid;gap:9px}
.login-para div{display:flex;gap:10px;align-items:baseline;font-size:13px;color:rgba(255,255,255,.72);line-height:1.35}
.login-para b{color:#fff;font-weight:700;flex:none;min-width:124px}
@media(max-width:860px){.login-para b{min-width:0;display:block}.login-para div{display:block}}
.login-form{display:flex;align-items:center;justify-content:center;padding:32px}
.login-card{width:100%;max-width:380px}
.login-card h2{font-size:34px;text-transform:uppercase}
.login-card .sub{color:var(--txt-2);margin:6px 0 26px;font-size:14px}
@media(max-width:860px){.login-wrap{grid-template-columns:1fr}.login-art{padding:28px;min-height:auto}.login-art h1{font-size:34px}.login-art .net{display:none}}

/* ============ SHELL ============ */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:var(--tinta);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .brand{padding:4px 8px 18px}
.side .brand-name{font-size:20px;color:#fff}
.nav-cap{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.35);padding:14px 10px 6px;font-weight:600}
.nav-i{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:10px;color:rgba(255,255,255,.72);font-size:14px;font-weight:500;cursor:pointer;transition:.15s}
.nav-i:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-i.on{background:var(--coral);color:#fff;box-shadow:0 8px 18px -8px rgba(255,90,54,.8)}
.nav-i .ic{width:18px;text-align:center;font-size:15px;opacity:.9}
.side-foot{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.1)}
.side-user{display:flex;align-items:center;gap:10px;padding:8px 6px}
.side-user .av{width:34px;height:34px;border-radius:10px;background:var(--tinta-2);display:grid;place-items:center;font-family:var(--disp);font-size:16px;color:#fff;overflow:hidden}
.side-user .av img{width:100%;height:100%;object-fit:cover}
.side-user b{font-size:13px;display:block;line-height:1.2}
.side-user span{font-size:11px;color:rgba(255,255,255,.5)}
.main{min-width:0;padding:26px 30px 90px}
.topbar{display:flex;align-items:flex-start;gap:16px;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap}
.topbar h1{font-size:32px;text-transform:uppercase}
.topbar .crumb{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--txt-3);font-weight:600;margin-bottom:4px}
.mobnav{display:none}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:16px 14px 96px}
  .topbar h1{font-size:26px}
  .mobnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--tinta);z-index:60;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));justify-content:space-around;box-shadow:0 -8px 30px rgba(14,36,54,.3)}
  .mobnav a{flex:1;text-align:center;color:rgba(255,255,255,.6);font-size:10px;font-weight:600;padding:4px 2px;border-radius:9px}
  .mobnav a .ic{display:block;font-size:17px;margin-bottom:2px}
  .mobnav a.on{color:#fff;background:rgba(255,255,255,.1)}
  .mobtop{display:flex!important}
}
.mobtop{display:none;align-items:center;justify-content:space-between;background:var(--tinta);color:#fff;padding:10px 14px;margin:-16px -14px 16px;position:sticky;top:0;z-index:50}
.mobtop .brand-name{font-size:17px;color:#fff}
.mobtop .brand-mark{width:32px;height:32px;font-size:18px;border-radius:9px}

/* ============ COMPONENTES ============ */
.card{background:var(--papel);border:1px solid var(--linha);border-radius:var(--r);box-shadow:var(--sh)}
.card-p{padding:18px}
.card-h{padding:15px 18px;border-bottom:1px solid var(--linha-f);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-h h3{font-size:19px;text-transform:uppercase}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
@media(max-width:1100px){.g5,.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}.g4.tight,.g5.tight{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--papel);border:1px solid var(--linha);border-radius:var(--r);padding:16px 16px 14px;position:relative;overflow:hidden}
.stat .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--txt-3);font-weight:700}
.stat .v{font-family:var(--disp);font-size:38px;line-height:1;margin-top:6px}
.stat .d{font-size:12px;color:var(--txt-2);margin-top:4px}
.stat:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--coral)}
.stat.v2:before{background:var(--verde)}.stat.v3:before{background:var(--dourado)}
.stat.v4:before{background:var(--azul)}.stat.v5:before{background:var(--tinta)}

.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;border:1px solid var(--linha);background:var(--papel);
  color:var(--txt);padding:9px 15px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--tinta);transform:translateY(-1px)}
.btn:active{transform:none}
.btn-p{background:var(--coral);border-color:var(--coral);color:#fff;box-shadow:0 8px 18px -10px rgba(255,90,54,.9)}
.btn-p:hover{background:var(--coral-d);border-color:var(--coral-d)}
.btn-d{background:var(--tinta);border-color:var(--tinta);color:#fff}
.btn-d:hover{background:var(--tinta-2);border-color:var(--tinta-2)}
.btn-g{background:var(--verde);border-color:var(--verde);color:#fff}
.btn-w{background:transparent;border-color:var(--vermelho);color:var(--vermelho)}
.btn-w:hover{background:var(--vermelho);color:#fff}
.btn-s{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

.field{margin-bottom:14px}
.field label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--txt-2);margin-bottom:5px}
.inp{width:100%;padding:10px 12px;border:1px solid var(--linha);border-radius:10px;background:var(--papel);color:var(--txt);transition:.15s}
.inp:focus{border-color:var(--tinta);outline:none;box-shadow:0 0 0 3px rgba(14,36,54,.08)}
textarea.inp{min-height:80px;resize:vertical}
.hint{font-size:11.5px;color:var(--txt-3);margin-top:4px}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;
  letter-spacing:.04em;background:var(--areia-2);color:var(--txt-2);text-transform:uppercase}
.badge.ok{background:rgba(14,159,110,.13);color:#0A7A54}
.badge.off{background:rgba(210,50,31,.12);color:var(--vermelho)}
.badge.live{background:rgba(210,50,31,.12);color:var(--vermelho)}
.badge.wait{background:rgba(47,115,184,.12);color:var(--azul)}
.badge.gold{background:rgba(239,164,0,.16);color:#9E6C00}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
table.tbl th{text-align:left;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-3);
  font-weight:700;padding:10px 14px;border-bottom:1px solid var(--linha);white-space:nowrap}
table.tbl td{padding:11px 14px;border-bottom:1px solid var(--linha-f);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tbody tr:hover{background:rgba(14,36,54,.025)}
.tbl .num{font-family:var(--mono);font-size:13px}

.empty{text-align:center;padding:46px 20px}
.empty .ico{font-size:40px;margin-bottom:10px;opacity:.35}
.empty h3{font-size:22px;text-transform:uppercase;margin-bottom:6px}
.empty p{color:var(--txt-2);max-width:46ch;margin:0 auto 16px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--linha);margin-bottom:18px;overflow-x:auto;padding-bottom:0}
.tab{padding:10px 14px;font-size:13px;font-weight:600;color:var(--txt-2);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--txt);border-color:var(--coral)}

.modal-bg{position:fixed;inset:0;background:rgba(14,36,54,.55);backdrop-filter:blur(3px);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--papel);border-radius:16px;width:100%;max-width:560px;max-height:92vh;overflow:auto;box-shadow:var(--sh-l);animation:up .2s}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.modal-h{padding:18px 20px;border-bottom:1px solid var(--linha-f);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--papel);z-index:2}
.modal-h h3{font-size:22px;text-transform:uppercase}
.modal-b{padding:20px}
.modal-f{padding:14px 20px;border-top:1px solid var(--linha-f);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--papel)}
@media(max-width:560px){.modal .grid{grid-template-columns:1fr!important}}
.x{border:none;background:var(--areia);width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:16px;color:var(--txt-2)}
.x:hover{background:var(--areia-2)}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--tinta);color:#fff;padding:11px 18px;border-radius:11px;font-size:14px;font-weight:500;box-shadow:var(--sh-l);animation:up .2s}
.toast.err{background:var(--vermelho)}
.toast.ok{background:var(--verde)}

.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;border:1px solid var(--linha);
  background:var(--papel);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center}

.av{width:36px;height:36px;border-radius:10px;background:var(--areia-2);display:grid;place-items:center;
  font-family:var(--disp);font-size:15px;color:var(--tinta);overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:60px;height:60px;font-size:24px;border-radius:14px}
.av.xl{width:92px;height:92px;font-size:34px;border-radius:18px}
.person{display:flex;align-items:center;gap:10px;min-width:0}
.person b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person span{font-size:11.5px;color:var(--txt-3)}

.bar{height:7px;border-radius:99px;background:var(--areia-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--coral);border-radius:99px}
.mini-bars{display:flex;align-items:flex-end;gap:6px;height:120px}
.mini-bars .b{flex:1;background:linear-gradient(180deg,var(--tinta-2),var(--tinta));border-radius:6px 6px 0 0;min-height:3px;position:relative}
.mini-bars .b span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:9.5px;color:var(--txt-3);font-weight:600}
.mini-bars .b b{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:10.5px;font-family:var(--mono)}
.chart-wrap{padding-top:20px;padding-bottom:24px}

/* ============ BRACKET ============ */
.bracket{display:flex;gap:34px;overflow-x:auto;padding:10px 4px 18px;align-items:flex-start}
.br-col{display:flex;flex-direction:column;gap:12px;justify-content:space-around;min-width:238px;flex:none}
.br-cap{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--txt-3);font-weight:700;text-align:center;padding-bottom:4px}
.br-m{background:var(--papel);border:1px solid var(--linha);border-radius:10px;overflow:hidden;position:relative;cursor:pointer;transition:.15s}
.br-m:hover{border-color:var(--tinta);box-shadow:var(--sh)}
.br-s{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;font-size:13px;color:var(--txt)}
.br-s+.br-s{border-top:1px solid var(--linha-f)}
.br-s.win{background:rgba(14,159,110,.08);font-weight:700}
.br-s.los{opacity:.5}
.br-s .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br-s .sc{font-family:var(--mono);font-size:13px;flex:none}
.br-m.live{border-color:var(--vermelho);box-shadow:0 0 0 3px rgba(210,50,31,.13)}
.br-m.final{border-color:var(--dourado);box-shadow:0 0 0 3px rgba(239,164,0,.18)}
.br-lane{display:flex;gap:34px;align-items:flex-start}
.brk-title{display:flex;align-items:center;gap:10px;margin:18px 0 8px}
.brk-title h3{font-size:20px;text-transform:uppercase}
.brk-title .ln{flex:1;height:1px;background:var(--linha)}

/* fotos dos atletas na chave */
.br-fotos{display:flex;flex:none}
.br-fotos .f{width:22px;height:22px;border-radius:50%;background:var(--areia-2);overflow:hidden;display:grid;place-items:center;
  font-size:9px;font-weight:700;color:var(--tinta);border:2px solid var(--papel);font-family:var(--body)}
.br-fotos .f+.f{margin-left:-9px}
.br-fotos .f img{width:100%;height:100%;object-fit:cover}
.br-s .nm{flex:1}
.br-tag{display:block;font-size:9px;background:var(--tinta);color:#fff;padding:3px 8px;letter-spacing:.14em;
  font-weight:700;text-align:center;text-transform:uppercase}
.br-m.final .br-tag{background:var(--dourado);color:#3B2A00}

/* seleção de atletas (duplas) */
.dp-i{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--linha);
  border-radius:10px;margin-bottom:7px;cursor:pointer;transition:.12s}
.dp-i:hover{border-color:var(--tinta);background:rgba(14,36,54,.03)}
.dp-i b{display:block;font-size:14px}
.dp-slot{border:1px dashed var(--linha);border-radius:12px;padding:11px;background:var(--areia)}
.dp-slot.on{border-style:solid;background:var(--papel)}

/* pódio do ranking */
.podio-r{display:grid;gap:12px;align-items:end;margin-bottom:20px}
.podio-r .pd{text-align:center}
.podio-r .topo{background:var(--papel);border:1px solid var(--linha);border-bottom:none;border-radius:14px 14px 0 0;
  padding:14px 10px 12px;box-shadow:var(--sh)}
.podio-r .tro{font-size:28px;line-height:1}
.podio-r .ft{display:flex;justify-content:center;margin:8px 0 6px}
.podio-r .nm{font-weight:700;font-size:13.5px;line-height:1.2}
.podio-r .cd{font-family:var(--mono);font-size:10.5px;color:var(--txt-3)}
.podio-r .pt{font-family:var(--mono);font-size:15px;margin-top:4px}
.podio-r .deg{border-radius:0 0 4px 4px;display:grid;place-items:center;font-family:var(--disp);font-size:36px;color:#fff}
.podio-r .p1 .deg{height:92px;background:linear-gradient(180deg,#F3C24B,#D08E00)}
.podio-r .p2 .deg{height:66px;background:linear-gradient(180deg,#CBD5DB,#94A5AF)}

<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast"></div>
<script>
/* =======================================================================
   GBR CONNECT — plataforma multi-organizador de torneios
   Arquivo único, offline, dados persistidos no navegador (localStorage).
   ======================================================================= */
"use strict";

/* ---------------------------------------------------------------
   0. UTILITÁRIOS
--------------------------------------------------------------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = p => {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8); return v.toString(16);
  });
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = n => (n || 0).toLocaleString('pt-BR');
const slugify = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'item';
function slugUnico(base, usados) {
  let sl = slugify(base), i = 2;
  while (usados.includes(sl)) sl = slugify(base) + '-' + (i++);
  return sl;
}
const initials = s => String(s || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const today = () => new Date().toISOString().slice(0, 10);
const fmtDate = d => { if (!d) return '—'; const p = String(d).slice(0, 10).split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : d; };
const fmtDT = ts => { const d = new Date(ts); return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); };
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const pl = (n, sing, plur) => num(n) + ' ' + (Number(n) === 1 ? sing : (plur || sing + 's'));
/* placar com o vencedor em verde e o perdedor em vermelho */
function placarCor(m, tam) {
  if (m.scoreA == null || m.scoreB == null) return '<span class="mut">—</span>';
  const venceuA = m.winnerId ? m.winnerId === m.teamAId : m.scoreA > m.scoreB;
  const st = tam ? `font-size:${tam};` : '';
  return `<b style="${st}color:${venceuA ? 'var(--verde)' : 'var(--vermelho)'}">${m.scoreA}</b>` +
    `<span class="mut-s" style="margin:0 5px">x</span>` +
    `<b style="${st}color:${venceuA ? 'var(--vermelho)' : 'var(--verde)'}">${m.scoreB}</b>`;
}

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;
  $('#toast').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = '.3s'; setTimeout(() => el.remove(), 320); }, 2600);
}

/* ---------------------------------------------------------------
   1. BANCO DE DADOS (localStorage) — estrutura multi-tenant
--------------------------------------------------------------- */
const DB_KEY = 'gbr_connect_db_v1';
const SESS_KEY = 'gbr_connect_sessao';
const TABLES = ['users', 'organizations', 'arenas', 'courts', 'athletes', 'teams', 'events', 'tournaments',
  'tournament_categories', 'registrations', 'matches', 'ranking_points', 'logs'];

let DB = null;

function emptyDB() {
  const db = { meta: { created: Date.now(), version: 1 } };
  TABLES.forEach(t => db[t] = []);
  db.users.push({
    id: 'usr_master', login: 'master', password: 'gbr2026', role: 'master',
    organizationId: null, name: 'Administrador GBR', active: true, createdAt: Date.now()
  });
  return db;
}
function loadDB() {
  if (typeof Nuvem !== 'undefined' && Nuvem.pronto) return DB;
  try {
    const raw = localStorage.getItem(DB_KEY);
    DB = raw ? JSON.parse(raw) : emptyDB();
  } catch (e) { DB = emptyDB(); }
  TABLES.forEach(t => { if (!Array.isArray(DB[t])) DB[t] = []; });
  if (!DB.users.some(u => u.role === 'master')) DB.users.push(emptyDB().users[0]);
  migrarCodigos();
  return DB;
}
/* cada atleta recebe um código sequencial dentro do organizador */
function migrarCodigos() {
  const maior = {};
  DB.athletes.forEach(a => { if (a.code) maior[a.organizationId] = Math.max(maior[a.organizationId] || 0, a.code); });
  let mudou = false;
  DB.athletes.forEach(a => {
    if (!a.code) { const n = (maior[a.organizationId] || 0) + 1; a.code = n; maior[a.organizationId] = n; mudou = true; }
  });
  if (mudou && !(typeof Nuvem !== 'undefined' && Nuvem.pronto)) { try { localStorage.setItem(DB_KEY, JSON.stringify(DB)); } catch (e) { } }
}
function proximoCodigo(orgId) {
  return DB.athletes.filter(a => a.organizationId === orgId).reduce((m, a) => Math.max(m, a.code || 0), 0) + 1;
}
function codigoAtleta(a) { return a && a.code ? '#' + String(a.code).padStart(3, '0') : ''; }

function saveDB() {
  if (typeof Nuvem !== 'undefined' && Nuvem.pronto) { Nuvem.agendar(); return; }
  try {
    localStorage.setItem(DB_KEY, JSON.stringify(DB));
    localStorage.setItem('gbr_ping', String(Date.now())); // dispara realtime em outras abas
  } catch (e) { toast('Armazenamento cheio. Exporte uma cópia de segurança e limpe dados antigos.', 'err'); }
}
function log(action, detail, orgId) {
  DB.logs.unshift({
    id: uid('log'), ts: Date.now(), userId: Sess.user ? Sess.user.id : null,
    userName: Sess.user ? Sess.user.name : 'sistema', role: Sess.user ? Sess.user.role : '-',
    organizationId: orgId !== undefined ? orgId : Sess.orgId, action, detail
  });
  if (DB.logs.length > 600) DB.logs.length = 600;
}

/* ---------------------------------------------------------------
   2. SESSÃO + ISOLAMENTO POR ORGANIZAÇÃO
   Toda leitura de dados passa por Q.*, que aplica o filtro de
   organization_id do contexto autenticado. Não existe consulta
   "solta" nas telas — é o equivalente ao RLS do Supabase.
--------------------------------------------------------------- */
const Sess = {
  user: null,        // usuário autenticado
  orgId: null,       // contexto de organização ativo
  impersonating: false,
  load() {
    try {
      const s = JSON.parse(localStorage.getItem(SESS_KEY) || 'null');
      if (!s) return false;
      const u = DB.users.find(x => x.id === s.userId && x.active !== false);
      if (!u) return false;
      this.user = u; this.orgId = s.orgId; this.impersonating = !!s.impersonating;
      if (u.role === 'organizer' || u.role === 'arbitro') this.orgId = u.organizationId;
      return true;
    } catch (e) { return false; }
  },
  persist() {
    localStorage.setItem(SESS_KEY, JSON.stringify({
      userId: this.user ? this.user.id : null, orgId: this.orgId, impersonating: this.impersonating
    }));
  },
  login(login, senha) {
    const u = DB.users.find(x => x.login.toLowerCase() === String(login).trim().toLowerCase());
    if (!u || u.password !== senha) return { ok: false, msg: 'Login ou senha incorretos.' };
    if (u.active === false) return { ok: false, msg: 'Este acesso está desativado. Fale com a GBR Connect.' };
    if (u.role === 'organizer' || u.role === 'arbitro') {
      const org = DB.organizations.find(o => o.id === u.organizationId);
      if (!org || org.status === 'inativo') return { ok: false, msg: 'Organizador inativo. Fale com a GBR Connect.' };
    }
    this.user = u; this.orgId = u.role === 'master' ? null : u.organizationId; this.impersonating = false;
    u.lastLogin = Date.now();
    this.persist(); log('login', 'Entrou na plataforma'); saveDB();
    return { ok: true, user: u };
  },
  logout() {
    if (Nuvem.pronto) {
      Nuvem.sair(); Nuvem.pronto = false; DB = emptyDB();
      this.user = null; this.orgId = null; this.impersonating = false;
      localStorage.removeItem(SESS_KEY);
      location.hash = '#/login';
      Nuvem.carregar().catch(() => { }).then(() => render());
      return;
    }
    log('logout', 'Saiu da plataforma'); saveDB();
    this.user = null; this.orgId = null; this.impersonating = false;

  if (perfil.active === false) { Nuvem.sair(); throw new Error('Este acesso está desativado. Fale com a GBR Connect.'); }
  if (perfil.role !== 'master') {

    if (org && org.status === 'inativo') { Nuvem.sair(); throw new Error('Organizador inativo. Fale com a GBR Connect.'); }

  log('login', 'Entrou na plataforma'); saveDB();
  return perfil;
}

/* Camada de acesso com escopo obrigatório */
function scoped(table, orgId) {
  const id = orgId !== undefined ? orgId : Sess.orgId;
  if (!id) return [];                                   // sem contexto => nada
  return DB[table].filter(r => r.organizationId === id);
}
const Q = {
  arenas: o => scoped('arenas', o),
  courts: o => scoped('courts', o),
  athletes: o => scoped('athletes', o),
  teams: o => scoped('teams', o),
  events: o => scoped('events', o),
  tournaments: o => scoped('tournaments', o),
  matches: o => scoped('matches', o),
  points: o => scoped('ranking_points', o),
  one(table, id) { // busca com verificação de escopo
    const r = DB[table].find(x => x.id === id);
    if (!r) return null;
    if (Sess.isMaster() && !Sess.impersonating) return r;
    if (r.organizationId && r.organizationId !== Sess.orgId) return null;
    return r;
  },
  arenaName(id) { const a = DB.arenas.find(x => x.id === id); return a ? a.name : '—'; },
  courtName(id) { const c = DB.courts.find(x => x.id === id); return c ? c.name : ''; },
  athlete(id) { return DB.athletes.find(x => x.id === id) || null; },
  team(id) { return DB.teams.find(x => x.id === id) || null; },
  teamName(id) {
    const t = DB.teams.find(x => x.id === id); if (!t) return '';
    const a = Q.athlete(t.athlete1Id), b = Q.athlete(t.athlete2Id);
    return [a ? a.name : '?', b ? b.name : '?'].join(' / ');
  },
  teamShort(id) {
    const t = DB.teams.find(x => x.id === id); if (!t) return '';
    const short = n => { const p = String(n || '').trim().split(/\s+/); return p[0]; };
    const a = Q.athlete(t.athlete1Id), b = Q.athlete(t.athlete2Id);
    return [short(a && a.name), short(b && b.name)].join(' / ');
  },
  orgName(id) { const o = DB.organizations.find(x => x.id === id); return o ? o.name : '—'; },
  event(id) { return DB.events.find(x => x.id === id) || null; },
  eventName(id) { const e = Q.event(id); return e ? e.name : '—'; },
  categorias(eventId) { return Q.tournaments().filter(t => t.eventId === eventId).sort((a, b) => (a.ordem || 0) - (b.ordem || 0) || String(a.name).localeCompare(String(b.name))); }
};

/* ---------------------------------------------------------------
   3. CONTADORES / AGREGAÇÕES (sem duplicar registros)
--------------------------------------------------------------- */
function orgStats(orgId, filtro) {
  const f = filtro || {};
  const inRange = d => {
    if (!f.from && !f.to) return true;
    const v = String(d || '').slice(0, 10);
    if (!v) return false;
    if (f.from && v < f.from) return false;
    if (f.to && v > f.to) return false;
    return true;
  };
  const arenaOk = a => !f.arenaId || f.arenaId === 'all' || a === f.arenaId;
  const tours = scoped('tournaments', orgId).filter(t => arenaOk(t.arenaId) && inRange(t.date));
  const tourIds = new Set(tours.map(t => t.id));
  const matches = scoped('matches', orgId).filter(m => tourIds.has(m.tournamentId));
  const teamIds = new Set(); const athIds = new Set();
  tours.forEach(t => (t.teamIds || []).forEach(id => {
    teamIds.add(id);
    const tm = Q.team(id); if (tm) { athIds.add(tm.athlete1Id); athIds.add(tm.athlete2Id); }
  }));
  const semFiltro = !f.from && !f.to && (!f.arenaId || f.arenaId === 'all');
  return {
    arenas: scoped('arenas', orgId).filter(a => arenaOk(a.id)).length,
    tournaments: tours.length,
    athletes: semFiltro ? scoped('athletes', orgId).length : athIds.size,
    teams: semFiltro ? scoped('teams', orgId).length : teamIds.size,
    matches: matches.filter(m => m.status === 'finalizado').length,
    matchesTotal: matches.length,
    live: matches.filter(m => m.status === 'andamento').length,
    tours
  };
}
function arenaStats(arenaId) {
  const a = DB.arenas.find(x => x.id === arenaId); if (!a) return null;
  return orgStats(a.organizationId, { arenaId });
}
function platformStats() {
  return {
    orgs: DB.organizations.filter(o => o.status !== 'inativo').length,
    orgsTotal: DB.organizations.length,
    arenas: DB.arenas.length, tournaments: DB.tournaments.length,
    athletes: DB.athletes.length, teams: DB.teams.length,
    matches: DB.matches.filter(m => m.status === 'finalizado').length
  };
}

/* ---------------------------------------------------------------
   4. MOTOR DE CHAVEAMENTO — DOUBLE ELIMINATION
   Gera a chave dos vencedores + a repescagem com avanço automático.
--------------------------------------------------------------- */
function seedOrder(size) {           // 1x16, 8x9, 5x12 ... (semeadura olímpica)
  let arr = [1, 2];
  while (arr.length < size) {
    const n = arr.length * 2, out = [];
    arr.forEach(s => { out.push(s); out.push(n + 1 - s); });
    arr = out;
  }
  return arr;
}
function nextPow2(n) { let s = 2; while (s < n) s *= 2; return s; }

function generateBracket(t, opts) {
  opts = opts || {};
  const ids = (t.teamIds || []).slice();
  if (ids.length < 2) return { ok: false, msg: 'Cadastre pelo menos 2 duplas para gerar a chave.' };
  if (opts.shuffle) for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[ids[i], ids[j]] = [ids[j], ids[i]]; }

  // limpa chave anterior
  DB.matches = DB.matches.filter(m => m.tournamentId !== t.id);

  const size = nextPow2(ids.length), k = Math.round(Math.log2(size));
  const seeds = seedOrder(size).map(s => ids[s - 1] || null);
  let seq = 0;
  const mk = (bracket, round, idx, label) => {
    const m = {
      id: uid('mt'), organizationId: t.organizationId, arenaId: t.arenaId, tournamentId: t.id,
      category: t.category || '', bracket, round, idx, label, seq: seq++,
      teamAId: null, teamBId: null, scoreA: null, scoreB: null, winnerId: null, loserId: null,
      status: 'pendente', courtId: null, date: t.date || null, time: null,
      nextW: null, nextL: null, bye: false, createdAt: Date.now()
    };
    DB.matches.push(m); return m;
  };

  const wb = [], lb = [];
  for (let r = 1; r <= k; r++) {
    const cnt = size / Math.pow(2, r), row = [];
    for (let i = 0; i < cnt; i++) {
      const label = r === k ? 'Final dos vencedores' : 'Vencedores · Rodada ' + r;
      row.push(mk('W', r, i, label));
    }
    wb.push(row);
  }
  const lbRounds = k >= 2 ? 2 * k - 2 : 0;
  for (let j = 1; j <= lbRounds; j++) {
    let cnt;

    function match(get, len) { var c = 0; for (var s = 0; s + 11 <= len; s++) { var ok = true, ok2 = true; for (var t = 0; t < 11; t++) { if (get(s + t) !== pat[t]) ok = false; if (get(s + t) !== pat[10 - t]) ok2 = false; } if (ok) c++; if (ok2) c++; } return c; }
    for (y = 0; y < size; y++) p += 40 * match(function (i) { return m[y][i]; }, size);
    for (x = 0; x < size; x++) p += 40 * match(function (i) { return m[i][x]; }, size);
    for (y = 0; y < size; y++) for (x = 0; x < size; x++) if (m[y][x]) dark++;
    p += Math.floor(Math.abs(dark * 100 / (size * size) - 50) / 5) * 10;
    return p;
  }
  return { matrix: matrix, build: build };
})();

function drawQR(canvas, text, scale, quiet) {
  const m = QRCode.matrix(text), n = m.length, q = quiet == null ? 3 : quiet, s = scale || 6;
  canvas.width = (n + q * 2) * s; canvas.height = canvas.width;
  const c = canvas.getContext && canvas.getContext('2d');
  if (!c) return;
  c.fillStyle = '#fff'; c.fillRect(0, 0, canvas.width, canvas.height);
  c.fillStyle = '#0E2436';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (m[y][x]) c.fillRect((x + q) * s, (y + q) * s, s, s);
}

/* Exclusões com verificação de uso — evita apagar algo que quebraria o histórico */
function excluirAtleta(id) {
  const a = Q.one('athletes', id); if (!a) return;
  const duplas = Q.teams().filter(t => t.athlete1Id === id || t.athlete2Id === id);
  if (duplas.length) {
    toast(`${a.name} está em ${duplas.length} dupla(s). Exclua as duplas antes.`, 'err');
    return;
  }
  confirmar('Excluir atleta', `Excluir <b>${esc(a.name)}</b>? Os pontos dele no ranking também serão removidos.`, () => {
    DB.ranking_points = DB.ranking_points.filter(p => p.athleteId !== id);
    DB.athletes = DB.athletes.filter(x => x.id !== id);
    log('atleta', 'Excluiu ' + a.name); saveDB(); render(); toast('Atleta excluído.', 'ok');
  }, 'Excluir');
}
function excluirDupla(id) {
  const t = Q.one('teams', id); if (!t) return;
  const nome = Q.teamName(id);
  const comChave = Q.tournaments().filter(x => (x.teamIds || []).includes(id) && x.bracketGenerated);
  if (comChave.length) {
    toast(`Esta dupla está na chave de ${comChave.length} torneio(s). Remova a inscrição antes.`, 'err');
    return;
  }
  confirmar('Excluir dupla', `Excluir a dupla <b>${esc(nome)}</b>? Os atletas continuam cadastrados.`, () => {
    DB.tournaments.forEach(x => { if (x.teamIds) x.teamIds = x.teamIds.filter(i => i !== id); });
    DB.teams = DB.teams.filter(x => x.id !== id);
    log('dupla', 'Excluiu a dupla ' + nome); saveDB(); render(); toast('Dupla excluída.', 'ok');
  }, 'Excluir');
}
function excluirArena(id) {
  const a = Q.one('arenas', id); if (!a) return;
  const tours = Q.tournaments().filter(t => t.arenaId === id);
  if (tours.length) {
    toast(`Esta arena tem ${tours.length} torneio(s). Exclua os torneios antes.`, 'err');
    return;
  }
  const quadras = Q.courts().filter(c => c.arenaId === id).length;
  confirmar('Excluir arena', `Excluir <b>${esc(a.name)}</b> e as ${quadras} quadra(s) dela?`, () => {
    DB.courts = DB.courts.filter(c => c.arenaId !== id);

  }, 'Excluir');
}
function excluirTorneio(id) {
  const t = Q.one('tournaments', id); if (!t) return;
  const jogos = DB.matches.filter(m => m.tournamentId === id).length;
  confirmarTexto('Excluir torneio', `Isso remove <b>${esc(t.name)}</b>, ${jogos} partida(s), a classificação e os pontos que ele gerou no ranking. Atletas e duplas continuam cadastrados.`,

async function excluirOrganizador(id) {

/* Construtor de formulário: campos = [{k,label,type,opts,req,val,ph,hint,half}] */
function formHTML(campos) {
  let out = '<div class="grid" style="grid-template-columns:1fr 1fr;gap:0 14px">';
  campos.forEach(c => {
    const st = c.half ? '' : 'grid-column:1/-1';
    const v = c.val == null ? '' : c.val;
    let inner;
    if (c.type === 'select') inner = `<select class="inp" data-k="${c.k}">${(c.opts || []).map(o =>
      `<option value="${esc(o.v)}" ${String(o.v) === String(v) ? 'selected' : ''}>${esc(o.t)}</option>`).join('')}</select>`;
    else if (c.type === 'textarea') inner = `<textarea class="inp" data-k="${c.k}" placeholder="${esc(c.ph || '')}">${esc(v)}</textarea>`;
    else if (c.type === 'file') inner = `<input type="file" class="inp" data-k="${c.k}" data-file="1" accept="image/*">
      <div class="hint">A imagem fica salva neste navegador.</div>`;
    else inner = `<input class="inp" type="${c.type || 'text'}" data-k="${c.k}" value="${esc(v)}" placeholder="${esc(c.ph || '')}">`;
    out += `<div class="field" style="${st}"><label>${esc(c.label)}${c.req ? ' *' : ''}</label>${inner}${c.hint ? `<div class="hint">${c.hint}</div>` : ''}</div>`;
  });
  return out + '</div>';
}
function readForm(root, campos) {
  const o = {};
  campos.forEach(c => {
    const el = $(`[data-k="${c.k}"]`, root); if (!el) return;
    o[c.k] = el.type === 'file' ? (el.dataset.b64 || undefined) : el.value.trim();
  });
  return o;
}
function bindFiles(root) {
  $$('[data-file]', root).forEach(inp => {
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return;
      if (f.size > 900000) { toast('Imagem muito grande. Use até 900 KB.', 'err'); inp.value = ''; return; }
      const r = new FileReader();
      r.onload = () => { inp.dataset.b64 = r.result; toast('Imagem carregada.', 'ok'); };
      r.readAsDataURL(f);
    };
  });
}
function formModal(title, campos, onSave, labelSave) {
  openModal(title, formHTML(campos),
    `<button class="btn" data-close="1">Cancelar</button><button class="btn btn-p" id="fm-save">${labelSave || 'Salvar'}</button>`,
    root => {
      bindFiles(root);
      const save = () => {
        const dados = readForm(root, campos);
        const falta = campos.filter(c => c.req && !dados[c.k]);
        if (falta.length) { toast('Preencha: ' + falta.map(c => c.label).join(', '), 'err'); return; }
        if (onSave(dados) !== false) closeModal();
      };
      $('#fm-save').onclick = save;
      $$('input', root).forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') save(); }));
      const first = $('input.inp,select.inp', root); if (first) first.focus();
    });
}
function avatar(src, nome, cls) {
  return `<div class="av ${cls || ''}">${src ? `<img src="${src}" alt="">` : esc(initials(nome))}</div>`;
}
function statusBadge(s) {
  const map = {
    ativo: ['ok', 'Ativo'], inativo: ['off', 'Inativo'], rascunho: ['', 'Rascunho'], aberto: ['wait', 'Inscrições'],
    andamento: ['live', '● Ao vivo'], finalizado: ['gold', 'Finalizado'], cancelado: ['off', 'Cancelado'],
    aguardando: ['wait', 'Aguardando'], pendente: ['', 'A definir']
  };

  return `<span class="badge ${m[0]}">${m[1]}</span>`;
}

function vazio(ico, titulo, texto, botao) {
  return `<div class="card"><div class="empty"><div class="ico">${ico}</div><h3>${esc(titulo)}</h3><p>${texto}</p>${botao || ''}</div></div>`;

function statCard(k, v, d, variante) { return `<div class="stat ${variante || ''}"><div class="k">${esc(k)}</div><div class="v">${v}</div>${d ? `<div class="d">${d}</div>` : ''}</div>`; }
function barChart(dados) {
  const max = Math.max(1, ...dados.map(d => d.v));
  return `<div class="chart-wrap"><div class="mini-bars">${dados.map(d =>
    `<div class="b" style="height:${Math.max(3, d.v / max * 100)}%"><b>${d.v || ''}</b><span>${esc(d.l)}</span></div>`).join('')}</div></div>`;
}
function ultimos12Meses(pegaData) {
  const out = [], hoje = new Date();
  for (let i = 11; i >= 0; i--) {
    const d = new Date(hoje.getFullYear(), hoje.getMonth() - i, 1);
    out.push({ ym: d.toISOString().slice(0, 7), l: ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'][d.getMonth()], v: 0 });
  }
  return out;
}

function formAcesso(org) {
  const u = DB.users.find(x => x.organizationId === org.id);
  const sugestao = slugify(org.name).replace(/-/g, '');
  const senha = 'gbr' + Math.floor(1000 + Math.random() * 8999);

  const campos = [
    { k: 'login', label: 'Usuário', req: true, val: u ? u.login : sugestao, half: true },
    { k: 'password', label: naNuvem && u ? 'Nova senha (opcional)' : 'Senha temporária', req: !(naNuvem && u), val: u ? (naNuvem ? '' : u.password) : senha, half: true },
    { k: 'name', label: 'Nome do usuário', req: true, val: u ? u.name : (org.responsible || org.name) }
  ];
  openModal(u ? 'Acesso de ' + org.name : 'Criar acesso — ' + org.name,
    `<div class="card card-p mb14" style="background:var(--areia);box-shadow:none">
      <div class="mut-s" style="letter-spacing:.14em;text-transform:uppercase;font-weight:700">Organizador</div>

    </div>${formHTML(campos)}

    `<button class="btn" data-close="1">Cancelar</button><button class="btn btn-p" id="ac-save">${u ? 'Atualizar acesso' : 'Criar acesso'}</button>`,
    root => {
      $('#ac-save').onclick = async () => {
        const d = readForm(root, campos);
        if (!d.login || !d.name || (!d.password && !(naNuvem && u))) { toast('Preencha login, senha e nome.', 'err'); return; }
        if (naNuvem) {
          const bt = $('#ac-save'); bt.disabled = true; bt.textContent = 'Salvando...';
          try {
            await Nuvem.sincronizar();
            await Nuvem.funcao('criar-acesso', u
              ? { acao: 'atualizar', userId: u.id, login: d.login, senha: d.password || undefined, nome: d.name }
              : { acao: 'criar', papel: 'organizer', organizationId: org.id, login: d.login, senha: d.password, nome: d.name });
            await Nuvem.carregar(); closeModal(); render();
            toast('Acesso salvo: ' + d.login + (d.password ? ' / ' + d.password : ''), 'ok');
          } catch (e) { toast(e.message, 'err'); bt.disabled = false; bt.textContent = u ? 'Atualizar acesso' : 'Criar acesso'; }
          return;
        }
        const dup = DB.users.find(x => x.login.toLowerCase() === d.login.toLowerCase() && (!u || x.id !== u.id));
        if (dup) { toast('Já existe um usuário com esse login.', 'err'); return; }
        if (u) { Object.assign(u, d); log('acesso', 'Atualizou o acesso de ' + org.name, org.id); }
        else {
          DB.users.push({ id: uid('usr'), ...d, role: 'organizer', organizationId: org.id, active: true, createdAt: Date.now() });
          log('acesso', 'Criou o acesso de ' + org.name, org.id);
        }
        saveDB(); closeModal(); render(); toast('Acesso salvo: ' + d.login + ' / ' + d.password, 'ok');
      };
    });
}

const Filtro = { periodo: 'all', from: null, to: null, arenaId: 'all' };
function periodoRange(p) {
  const d = new Date(), z = n => String(n).padStart(2, '0');
  const iso = x => x.getFullYear() + '-' + z(x.getMonth() + 1) + '-' + z(x.getDate());
  if (p === 'hoje') return { from: iso(d), to: iso(d) };
  if (p === '7d') { const a = new Date(d); a.setDate(a.getDate() - 6); return { from: iso(a), to: iso(d) }; }
  if (p === 'mes') return { from: iso(new Date(d.getFullYear(), d.getMonth(), 1)), to: iso(d) };
  if (p === 'ano') return { from: d.getFullYear() + '-01-01', to: iso(d) };
  return { from: null, to: null };
}
function filtrosHTML() {
  const arenas = Q.arenas();
  const per = [['all', 'Tudo'], ['hoje', 'Hoje'], ['7d', '7 dias'], ['mes', 'Este mês'], ['ano', 'Este ano'], ['custom', 'Personalizado']];

    <div class="flexb" style="gap:14px">

    </div>

      <input type="date" class="inp" id="f-ate" value="${Filtro.to || ''}" style="max-width:170px"></div>` : ''}</div>`;

function formDupla(t) {
  const todos = Q.athletes().slice().sort((a, b) => a.name.localeCompare(b.name));
  if (todos.length < 2) { toast('Cadastre pelo menos 2 atletas antes de formar duplas.', 'err'); return; }
  let sel = t ? [t.athlete1Id, t.athlete2Id].filter(Boolean) : [];
  openModal(t ? 'Editar dupla' : 'Nova dupla',
    `<div id="dp-sel"></div>
     <div class="field" style="margin-bottom:10px"><label>Buscar atleta</label>
       <input class="inp" id="dp-busca" placeholder="digite o nome ou o código (ex.: 012)"></div>
     <div id="dp-lista" style="max-height:36vh;overflow:auto;padding-right:2px"></div>
     <div class="field" style="margin-top:16px"><label>Nome da dupla (opcional)</label>
       <input class="inp" id="dp-nome" value="${esc((t && t.name) || '')}" placeholder="deixe vazio para usar os nomes dos atletas"></div>`,
    `<button class="btn" data-close="1">Cancelar</button><button class="btn btn-p" id="dp-save">Salvar dupla</button>`,
    root => {
      const pintar = () => {
        $('#dp-sel').innerHTML = `<div class="grid" style="grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
          ${[0, 1].map(i => {
          const a = sel[i] ? Q.athlete(sel[i]) : null;
          return `<div class="dp-slot ${a ? 'on' : ''}">
              <div class="mut-s" style="text-transform:uppercase;letter-spacing:.12em;font-weight:700">Atleta ${i + 1}</div>
              ${a ? `<div class="person" style="margin-top:8px">${avatar(a.photo, a.name)}
                  <div style="min-width:0;flex:1"><b>${esc(a.name)}</b><span class="num">${codigoAtleta(a)}</span></div>
                  <button class="btn btn-s" data-rm="${i}">✕</button></div>`
              : '<div class="mut-s" style="margin-top:10px">escolha na lista abaixo</div>'}</div>`;
        }).join('')}</div>`;
        const q = ($('#dp-busca').value || '').toLowerCase().trim();
        const livres = todos.filter(a => !sel.includes(a.id))
          .filter(a => !q || a.name.toLowerCase().includes(q) || codigoAtleta(a).toLowerCase().includes(q) || String(a.code || '').includes(q));
        $('#dp-lista').innerHTML = livres.length ? livres.map(a => {
          const nd = Q.teams().filter(x => x.athlete1Id === a.id || x.athlete2Id === a.id).length;
          return `<div class="dp-i" data-pick="${a.id}">${avatar(a.photo, a.name)}
            <div style="min-width:0;flex:1"><b>${esc(a.name)}</b>
              <span class="mut-s"><span class="num">${codigoAtleta(a)}</span>${a.category ? ' · ' + esc(a.category) : ''}</span></div>
            ${nd ? `<span class="badge">${nd} dupla${nd > 1 ? 's' : ''}</span>` : ''}</div>`;
        }).join('') : `<div class="mut-s" style="padding:14px;text-align:center">${sel.length >= 2 ? 'Dupla completa. Remova um atleta para trocar.' : 'Nenhum atleta encontrado com esse nome ou código.'}</div>`;
        $$('[data-pick]', root).forEach(el => el.onclick = () => {
          if (sel.length >= 2) { toast('A dupla já tem dois atletas.', 'err'); return; }
          sel.push(el.dataset.pick); pintar();
        });
        $$('[data-rm]', root).forEach(b => b.onclick = () => { sel.splice(Number(b.dataset.rm), 1); pintar(); });
      };
      $('#dp-busca').oninput = pintar;
      pintar();
      $('#dp-busca').focus();
      $('#dp-save').onclick = () => {
        if (sel.length < 2) { toast('Escolha os dois atletas da dupla.', 'err'); return; }
        const [a1, a2] = sel;
        const jaExiste = Q.teams().find(x => (!t || x.id !== t.id) &&
          ((x.athlete1Id === a1 && x.athlete2Id === a2) || (x.athlete1Id === a2 && x.athlete2Id === a1)));
        if (jaExiste) { toast('Essa dupla já existe na sua base.', 'err'); return; }
        const nome = $('#dp-nome').value.trim();
        if (t) Object.assign(t, { athlete1Id: a1, athlete2Id: a2, name: nome });
        else DB.teams.push({ id: uid('tm'), organizationId: Sess.orgId, athlete1Id: a1, athlete2Id: a2, name: nome, createdAt: Date.now() });
        log('dupla', 'Salvou a dupla ' + Q.athlete(a1).name + ' / ' + Q.athlete(a2).name);
        saveDB(); closeModal(); render(); toast('Dupla salva.', 'ok');
      };
    });
}

/* ---------- EVENTOS (o dia) e CATEGORIAS (cada chave) ---------- */
function migrarEventos() {
  if (!Sess.user || Sess.isArbitro() || !Sess.orgId) return false;
  const soltos = Q.tournaments().filter(t => !t.eventId);
  if (!soltos.length) return false;
  const grupos = {};
  soltos.forEach(t => { const k = (t.arenaId || '-') + '|' + (t.date || '-'); (grupos[k] = grupos[k] || []).push(t); });
  const usados = DB.events.map(e => e.slug);
  Object.values(grupos).forEach(lista => {
    const base = lista[0];
    const nome = (Q.arenaName(base.arenaId) || 'Evento') + ' · ' + fmtDate(base.date).slice(0, 5);
    const ev = {
      id: uid('ev'), organizationId: base.organizationId, arenaId: base.arenaId, name: nome,
      slug: slugUnico(nome, usados), date: base.date, time: base.time || null,
      description: '', rules: '', status: 'aberto', createdAt: Date.now()
    };
    usados.push(ev.slug);
    DB.events.push(ev);
    lista.forEach(t => { t.eventId = ev.id; if (!t.category) t.category = t.name; });
  });
  log('evento', 'Organizou os torneios existentes em eventos');
  saveDB();
  return true;
}
function formEvento(ev) {
  const arenas = Q.arenas();
  if (!arenas.length) { toast('Cadastre uma arena antes de criar um evento.', 'err'); formArena(); return; }
  const campos = [
    { k: 'name', label: 'Nome do evento', req: true, val: ev && ev.name, ph: 'ex.: 3ª Etapa Viva Beach' },
    { k: 'arenaId', label: 'Arena', type: 'select', req: true, val: ev && ev.arenaId, opts: arenas.map(a => ({ v: a.id, t: a.name })) },
    { k: 'date', label: 'Data', type: 'date', req: true, val: ev ? ev.date : today(), half: true },
    { k: 'time', label: 'Horário de início', type: 'time', val: ev ? ev.time : '08:00', half: true },
    { k: 'status', label: 'Situação', type: 'select', val: ev ? ev.status : 'aberto', half: true, opts: [
        { v: 'rascunho', t: 'Rascunho' }, { v: 'aberto', t: 'Inscrições abertas' }, { v: 'andamento', t: 'Em andamento' },
        { v: 'finalizado', t: 'Finalizado' }, { v: 'cancelado', t: 'Cancelado' }] },

    if (ev) {
      const trocouData = ev.date !== d.date, trocouArena = ev.arenaId !== d.arenaId;
      Object.assign(ev, d, { banner: d.banner || ev.banner });
      if (trocouData || trocouArena) Q.categorias(ev.id).forEach(t => { t.date = ev.date; t.arenaId = ev.arenaId; });
      log('evento', 'Editou ' + ev.name); saveDB(); render(); toast('Evento salvo.', 'ok');
    } else {
      const novo = {
        id: uid('ev'), organizationId: Sess.orgId, ...d,
        slug: slugUnico(d.name, DB.events.map(e => e.slug)), createdAt: Date.now()
      };
      DB.events.push(novo);
      log('evento', 'Criou o evento ' + novo.name); saveDB();

function excluirEvento(id) {
  const ev = Q.event(id); if (!ev) return;
  const cats = Q.categorias(id);
  confirmarTexto('Excluir evento', `Isso remove <b>${esc(ev.name)}</b> e as ${cats.length} categoria(s) dele, com as chaves e os pontos gerados. Atletas e duplas continuam cadastrados.`,
    'excluir', () => {
      const ids = cats.map(c => c.id);
      DB.matches = DB.matches.filter(m => !ids.includes(m.tournamentId));
      DB.ranking_points = DB.ranking_points.filter(p => !ids.includes(p.tournamentId));
      DB.tournaments = DB.tournaments.filter(t => t.eventId !== id);
      DB.events = DB.events.filter(e => e.id !== id);
      log('evento', 'Excluiu ' + ev.name); saveDB(); go('#/org/torneios'); render(); toast('Evento excluído.', 'ok');
    });
}
function eventoStats(id) {
  const cats = Q.categorias(id);
  const ids = cats.map(c => c.id);
  const ms = Q.matches().filter(m => ids.includes(m.tournamentId) && !m.dead);
  const duplas = new Set(); cats.forEach(c => (c.teamIds || []).forEach(t => duplas.add(t)));
  return {
    categorias: cats.length, duplas: duplas.size, inscricoes: cats.reduce((a, c) => a + (c.teamIds || []).length, 0),
    jogos: ms.length, fim: ms.filter(m => m.status === 'finalizado').length,
    live: ms.filter(m => m.status === 'andamento').length, cats, ms
  };
}

/* ---------- TORNEIOS ---------- */
function formTorneio(t, evento) {
  const arenas = Q.arenas();
  if (!arenas.length) { toast('Cadastre uma arena antes de criar um torneio.', 'err'); formArena(); return; }
  const ev = evento || (t && Q.event(t.eventId));
  const campos = [
    { k: 'name', label: ev ? 'Nome da categoria' : 'Nome do torneio', req: true, val: t && t.name, ph: 'ex.: Iniciante, Misto, Feminino' },
    ...(ev ? [] : [{ k: 'arenaId', label: 'Arena', type: 'select', req: true, val: t && t.arenaId, opts: arenas.map(a => ({ v: a.id, t: a.name })) }]),
    { k: 'sport', label: 'Esporte', type: 'select', val: t ? t.sport : 'Futevôlei', half: true, opts: ['Futevôlei', 'Beach tennis', 'Vôlei de praia', 'Padel', 'Tênis', 'Outro'].map(v => ({ v, t: v })) },
    { k: 'category', label: 'Categoria', val: t && t.category, half: true, ph: 'Intermediário' },
    ...(ev ? [] : [{ k: 'date', label: 'Data', type: 'date', req: true, val: t ? t.date : today(), half: true }]),
    { k: 'time', label: 'Horário', type: 'time', val: t ? t.time : (ev ? ev.time : '08:00'), half: true },
    { k: 'format', label: 'Formato', type: 'select', val: t ? t.format : 'double', half: true, opts: [
        { v: 'double', t: 'Eliminatória dupla (vencedores + repescagem)' },
        { v: 'single', t: 'Eliminatória simples — em breve' },
        { v: 'roundrobin', t: 'Todos contra todos — em breve' },
        { v: 'grupos', t: 'Grupos + eliminatória — em breve' },
        { v: 'suico', t: 'Sistema suíço — em breve' }] },
    { k: 'maxTeams', label: 'Máximo de duplas', type: 'number', val: t ? t.maxTeams : 16, half: true },
    { k: 'fee', label: 'Valor da inscrição (R$)', type: 'number', val: t && t.fee, half: true },
    { k: 'status', label: 'Situação', type: 'select', val: t ? t.status : 'aberto', half: true, opts: [
        { v: 'rascunho', t: 'Rascunho' }, { v: 'aberto', t: 'Inscrições abertas' }, { v: 'andamento', t: 'Em andamento' },
        { v: 'finalizado', t: 'Finalizado' }, { v: 'cancelado', t: 'Cancelado' }] },
    { k: 'banner', label: 'Banner', type: 'file' },
    { k: 'description', label: 'Descrição', type: 'textarea', val: t && t.description },
    { k: 'rules', label: 'Regulamento', type: 'textarea', val: t && t.rules }
  ];
  formModal(t ? (ev ? 'Editar categoria' : 'Editar torneio') : (ev ? 'Nova categoria — ' + ev.name : 'Criar torneio'), campos, d => {
    if (ev) { d.arenaId = ev.arenaId; d.date = ev.date; }
    if (d.format !== 'double') { toast('Nesta versão a chave automática é a eliminatória dupla — o torneio ficou nesse formato.', ''); d.format = 'double'; }
    if (t) { Object.assign(t, d, { banner: d.banner || t.banner }); log('torneio', 'Editou ' + t.name); saveDB(); render(); toast('Torneio salvo.', 'ok'); }
    else {
      const baseNome = ev ? (ev.name + ' ' + d.name) : d.name;
      const slug = slugUnico(baseNome, DB.tournaments.map(x => x.slug).concat(DB.events.map(x => x.slug)));
      const novo = {
        id: uid('trn'), organizationId: Sess.orgId, ...d, slug, teamIds: [], bracketGenerated: false,
        eventId: ev ? ev.id : null, category: d.category || d.name,
        pointsConfig: (Sess.org().pointsConfig || defaultPoints()), createdAt: Date.now()
      };
      DB.tournaments.push(novo); log('torneio', 'Criou ' + novo.name); saveDB();
      toast((ev ? 'Categoria criada' : 'Torneio criado') + '. Agora inscreva as duplas.', 'ok');
      go('#/org/torneio/' + novo.id);
    }
  }, t ? 'Salvar' : (ev ? 'Criar categoria' : 'Criar torneio'));
}

/* ---------- DETALHE DO TORNEIO ---------- */
function oTorneio(app, params) {
  const t = Q.one('tournaments', params[0]);
  if (!t) { toast('Torneio não encontrado.', 'err'); go('#/org/torneios'); return; }
  let aba = params[1] || 'visao';
  const ms = Q.matches().filter(m => m.tournamentId === t.id && !m.dead).sort((a, b) => a.seq - b.seq);
  const temChave = ms.length > 0, temDuplas = (t.teamIds || []).length > 0;
  const abas = [['visao', 'Visão geral', true], ['duplas', 'Duplas', true], ['chave', 'Chave', temChave],
    ['partidas', 'Partidas', temChave], ['classificacao', 'Classificação', temDuplas], ['divulgacao', 'Divulgação', true]];
  aba = abaValida(abas, aba);
  let corpo = '';
  if (aba === 'visao') corpo = tVisao(t, ms);
  if (aba === 'duplas') corpo = tDuplas(t);
  if (aba === 'chave') corpo = ms.length ? renderBracket(ms, false) : semChave(t);
  if (aba === 'partidas') corpo = tPartidas(t, ms);
  if (aba === 'classificacao') corpo = tClassificacao(t, ms);
  if (aba === 'divulgacao') corpo = tDivulgacao(t);
  const html = `<div class="tabs">${abasAdminHTML(abas, aba, k => `#/org/torneio/${t.id}/${k}`)}</div>${corpo}`;
  const evPai = Q.event(t.eventId);
  shell(app, MENU_ORG, 'torneios', t.name,
    evPai ? `${evPai.name} · ${Q.arenaName(t.arenaId)} · ${fmtDate(t.date)}` : `${Q.arenaName(t.arenaId)} · ${fmtDate(t.date)}`,
    `${evPai ? `<a class="btn" href="#/org/evento/${evPai.id}">← Voltar ao evento</a>` : ''}
     <a class="btn" href="#/t/${t.slug}" target="_blank">Página pública</a>
     <a class="btn" href="#/tv/${t.slug}" target="_blank">Telão</a>
     <button class="btn btn-d" id="ed-t">Editar</button>
     <button class="btn btn-w" id="del-t">Excluir</button>
     ${ms.length ? '<button class="btn btn-p" id="gerar">Regerar chave</button>' : '<button class="btn btn-p" id="gerar">Gerar chave</button>'}`, html);
  $('#del-t').onclick = () => excluirTorneio(t.id);
  $('#ed-t').onclick = () => formTorneio(t);
  $('#gerar').onclick = () => {
    const n = (t.teamIds || []).length;
    if (n < 2) { toast('Inscreva pelo menos 2 duplas.', 'err'); go('#/org/torneio/' + t.id + '/duplas'); return; }
    const acao = () => {
      const r = generateBracket(t, { shuffle: false });
      if (!r.ok) { toast(r.msg, 'err'); return; }
      toast(`Chave gerada: ${n} duplas em um quadro de ${r.size}.`, 'ok');
      go('#/org/torneio/' + t.id + '/chave'); render();
    };
    if (ms.some(m => m.status === 'finalizado' && !m.bye))
      confirmar('Regerar a chave', 'Os resultados já lançados serão apagados e a chave será montada de novo.', acao, 'Regerar');
    else acao();
  };
  bindCardPartida();
  $$('[data-abrir-m]').forEach(b => b.onclick = () => modalResultado(b.dataset.abrirM));
  if ($('#add-dupla')) $('#add-dupla').onclick = () => modalInscricao(t);
  $$('[data-rm-insc]').forEach(b => b.onclick = () => {
    t.teamIds = (t.teamIds || []).filter(x => x !== b.dataset.rmInsc);
    saveDB(); render(); toast('Dupla removida do torneio.', 'ok');
  });
  if ($('#qr-canvas')) {
    const url = linkPublico(t);
    drawQR($('#qr-canvas'), url, 6);
    $('#copiar').onclick = () => {
      navigator.clipboard.writeText(url).then(() => toast('Link copiado.', 'ok'), () => toast('Copie manualmente: ' + url, ''));
    };
    $('#baixar-qr').onclick = () => {
      const a = document.createElement('a');
      a.href = $('#qr-canvas').toDataURL('image/png'); a.download = 'qrcode-' + t.slug + '.png'; a.click();
    };
    $('#imprimir').onclick = () => window.print();
  }
}

    `<a class="btn btn-p" href="#/org/torneio/${t.id}/duplas">Gerenciar duplas</a>`);
}
function linkPublico(t) {

}
function tVisao(t, ms) {

          <td><b>${esc(Q.teamShort(m.teamAId))}</b> <span class="mut-s">x</span> <b>${esc(Q.teamShort(m.teamBId))}</b>

      </div>
      <div class="card"><div class="card-h"><h3>Informações</h3></div>
        <div class="card-p">
          <div class="pill-list" style="gap:10px">
            <span class="badge">${esc(t.sport || '—')}</span><span class="badge">${esc(t.category || 'sem categoria')}</span>
            <span class="badge">${esc(fmtDate(t.date))} ${esc(t.time || '')}</span>
            <span class="badge">${esc(Q.arenaName(t.arenaId))}</span>
            <span class="badge gold">eliminatória dupla</span>

function tDuplas(t) {

function modalInscricao(t) {

/* ---------- CHAVE ---------- */
function renderBracket(todas, publico) {
  const ms = todas.filter(m => !m.dead);
  const wb = ms.filter(m => m.bracket === 'W'), lb = ms.filter(m => m.bracket === 'L'), gf = ms.filter(m => m.bracket === 'F');
  const cols = arr => {
    const rodadas = [...new Set(arr.map(m => m.round))].sort((a, b) => a - b);
    return rodadas.map(r => {
      const list = arr.filter(m => m.round === r).sort((a, b) => a.idx - b.idx);
      if (!list.length) return '';
      return `<div class="br-col"><div class="br-cap">${esc(list[0].label.replace(/^.*·\s*/, '') || 'Rodada ' + r)}</div>
        ${list.map(m => matchBox(m, publico)).join('')}</div>`;
    }).join('');
  };
  return `<div class="brk-title"><h3>Chave dos vencedores</h3><div class="ln"></div><span class="mut-s">quem vence, segue</span></div>
    <div class="bracket">${cols(wb)}${gf.length ? `<div class="br-col"><div class="br-cap">Grande final</div>${gf.map(m => matchBox(m, publico)).join('')}</div>` : ''}</div>
    ${lb.length ? `<div class="brk-title"><h3>Repescagem</h3><div class="ln"></div><span class="mut-s">a segunda derrota elimina</span></div>
    <div class="bracket">${cols(lb)}</div>` : ''}`;
}
function fotosDupla(id) {
  const t = Q.team(id);
  if (!t) return `<span class="br-fotos"><span class="f" style="opacity:.4">·</span></span>`;
  return `<span class="br-fotos">${[t.athlete1Id, t.athlete2Id].map(aid => {
    const a = Q.athlete(aid);
    return `<span class="f" title="${esc(a ? a.name : '')}">${a && a.photo ? `<img src="${a.photo}" alt="">` : esc(initials(a ? a.name : '?'))}</span>`;
  }).join('')}</span>`;
}
function matchBox(m, publico) {
  const cls = m.status === 'andamento' ? 'live' : (m.bracket === 'F' ? 'final' : '');
  const side = (id, sc, win) => {
    const nome = id ? Q.teamShort(id) : '—';
    const c = m.winnerId ? (win ? 'win' : 'los') : '';
    const cor = m.winnerId && sc != null ? (win ? 'var(--verde)' : 'var(--vermelho)') : '';
    return `<div class="br-s ${c}">${fotosDupla(id)}<span class="nm">${esc(nome)}</span>
      <span class="sc" style="${cor ? 'color:' + cor + ';font-weight:800' : ''}">${sc == null ? '' : sc}</span></div>`;
  };
  return `<div class="br-m ${cls}" ${publico ? '' : `data-abrir-m="${m.id}"`} title="${esc(m.label)}">
    ${m.bracket === 'F' ? `<span class="br-tag">${m.isReset ? 'Final — desempate' : 'Grande final'}</span>` : ''}
    ${side(m.teamAId, m.scoreA, m.winnerId === m.teamAId)}

function linhaPartida(m, comTorneio) {

  return `<tr><td class="nowrap"><span class="badge">${esc(m.bracket === 'W' ? 'V' : m.bracket === 'L' ? 'R' : 'F')}${m.bracket === 'F' ? '' : m.round}</span>
      <div class="mut-s">${esc(m.label)}${comTorneio ? '<br>' + esc(nomeTorneio(m.tournamentId)) : ''}</div></td>
    <td><b class="${m.winnerId === m.teamAId ? 'venceu' : ''}">${esc(Q.teamName(m.teamAId) || (m.bye ? 'sem adversário' : 'a definir'))}</b></td>
    <td class="num center nowrap" style="min-width:78px">${placarCor(m)}</td>
    <td><b class="${m.winnerId === m.teamBId ? 'venceu' : ''}">${esc(Q.teamName(m.teamBId) || (m.bye ? 'sem adversário' : 'a definir'))}</b></td>

function tPartidas(t, ms) {
  if (!ms.length) return semChave(t);
  return `<div class="card"><div class="card-h"><h3>Todas as partidas</h3>
      <span class="mut-s">${ms.filter(m => m.status === 'finalizado').length} de ${ms.length} finalizadas</span></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fase</th><th>Dupla A</th><th>Placar</th><th>Dupla B</th><th>Quadra</th><th>Hora</th><th>Situação</th><th></th></tr></thead>
    <tbody>${ms.map(m => linhaPartida(m)).join('')}</tbody></table></div></div>`;

function tClassificacao(t, ms) {
  const st = t.standings && t.standings.length ? t.standings : null;
  if (!st) {
    const vivos = (t.teamIds || []).map(id => {
      const der = ms.filter(m => m.status === 'finalizado' && m.loserId === id).length;
      const v = ms.filter(m => m.winnerId === id && !m.bye).length;
      return { id, der, v };
    }).sort((a, b) => a.der - b.der || b.v - a.v);
    return `<div class="card"><div class="card-h"><h3>Situação atual</h3><span class="mut-s">a classificação final sai no fim do torneio</span></div>
      ${vivos.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Dupla</th><th>Vitórias</th><th>Derrotas</th><th>Situação</th></tr></thead><tbody>
      ${vivos.map(x => `<tr><td><b>${esc(Q.teamName(x.id))}</b></td><td class="num">${x.v}</td><td class="num">${x.der}</td>
        <td>${x.der >= 2 ? '<span class="badge off">Eliminada</span>' : x.der === 1 ? '<span class="badge wait">Repescagem</span>' : '<span class="badge ok">Invicta</span>'}</td></tr>`).join('')}
      </tbody></table></div>` : '<div class="empty" style="padding:26px"><p class="mut">Inscreva as duplas para acompanhar.</p></div>'}</div>`;
  }
  const cfg = t.pointsConfig || defaultPoints();
  return `<div class="card"><div class="card-h"><h3>Classificação final</h3><span class="badge gold">torneio encerrado</span></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Posição</th><th>Dupla</th><th>Pontos por atleta</th></tr></thead><tbody>
    ${st.map(s => `<tr><td class="num"><b style="font-size:16px">${s.pos}º</b></td><td><b>${esc(Q.teamName(s.teamId))}</b></td>
      <td class="num">${num(pointsFor(cfg, s.pos))}</td></tr>`).join('')}</tbody></table></div></div>`;
}

/* ---------- MODAL DE RESULTADO ---------- */
function modalResultado(matchId) {
  const m = DB.matches.find(x => x.id === matchId);
  if (!m || (Sess.orgId && m.organizationId !== Sess.orgId)) return;
  if (!m.teamAId || !m.teamBId) { toast('Esta partida ainda depende de outros jogos.', 'err'); return; }
  const t = DB.tournaments.find(x => x.id === m.tournamentId);
  const arena = t ? t.arenaId : null;
  const quadras = Q.courts().filter(c => c.arenaId === arena);
  openModal('Lançar resultado',
    `<div class="mut-s mb14">${esc(t ? t.name : '')} · ${esc(m.label)}</div>
     <div class="card card-p mb14" style="background:var(--areia);box-shadow:none">
       <div class="flexb" style="gap:12px"><b style="font-size:16px;flex:1">${esc(Q.teamName(m.teamAId))}</b>
         <input class="inp" id="sa" type="number" inputmode="numeric" value="${m.scoreA == null ? '' : m.scoreA}" style="width:88px;text-align:center;font-family:var(--mono);font-size:19px"></div>
       <div class="flexb" style="gap:12px;margin-top:10px"><b style="font-size:16px;flex:1">${esc(Q.teamName(m.teamBId))}</b>
         <input class="inp" id="sb" type="number" inputmode="numeric" value="${m.scoreB == null ? '' : m.scoreB}" style="width:88px;text-align:center;font-family:var(--mono);font-size:19px"></div>
     </div>
     <div class="grid" style="grid-template-columns:1fr 1fr;gap:0 14px">
       <div class="field"><label>Quadra</label><select class="inp" id="qd"><option value="">—</option>
         ${quadras.map(c => `<option value="${c.id}" ${m.courtId === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div>
       <div class="field"><label>Horário</label><input class="inp" id="hr" type="time" value="${esc(m.time || '')}"></div>
     </div>
     <div class="btn-row"><button class="btn ${m.status === 'andamento' ? 'btn-g' : ''}" id="ao-vivo">${m.status === 'andamento' ? '● Em quadra agora' : 'Marcar como em quadra'}</button>
       ${m.status === 'finalizado' ? '<button class="btn btn-w" id="limpar">Desfazer resultado</button>' : ''}</div>
     <div class="hint mt14">Ao salvar, o vencedor avança no winners, o perdedor cai para o losers e a próxima partida é liberada automaticamente.</div>`,
    `<button class="btn" data-close="1">Cancelar</button><button class="btn btn-p" id="rs-save">Salvar resultado</button>`,
    root => {
      const aplicarLocal = () => {
        m.courtId = $('#qd').value || null; m.time = $('#hr').value || null;
      };
      $('#ao-vivo').onclick = () => {
        aplicarLocal();
        m.status = m.status === 'andamento' ? 'aguardando' : 'andamento';
        if (m.status === 'andamento') { m.scoreA = Number($('#sa').value) || 0; m.scoreB = Number($('#sb').value) || 0; }
        const t2 = DB.tournaments.find(x => x.id === m.tournamentId);
        if (t2 && t2.status === 'aberto') t2.status = 'andamento';
        saveDB(); closeModal(); render(); toast('Partida atualizada.', 'ok');
      };
      if ($('#limpar')) $('#limpar').onclick = () => confirmar('Desfazer resultado',
        'A chave será recalculada e os avanços seguintes desfeitos.', () => { clearResult(m.id); closeModal(); render(); toast('Resultado desfeito.', 'ok'); }, 'Desfazer');
      $('#rs-save').onclick = () => {
        aplicarLocal();
        if (setResult(m.id, $('#sa').value, $('#sb').value)) {
          closeModal(); render();
          const t2 = DB.tournaments.find(x => x.id === m.tournamentId);
          toast(t2 && t2.status === 'finalizado' ? 'Torneio encerrado! Ranking atualizado.' : 'Resultado salvo. Chave atualizada.', 'ok');
        }
      };
      $('#sa').focus(); $('#sa').select();
      $$('#sa,#sb', root).forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') $('#rs-save').click(); }));
    });
}
